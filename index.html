<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>HYCLOTH — Hybrid Luxury Streetwear</title>
<meta name="description" content="HYCLOTH — hybrid luxury streetwear."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..800&family=Manrope:wght@300..800&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#080808;--bg2:#111;--bg3:#171717;--gold:#C5A05A;--ivory:#F4F0E8;--muted:#A5A19A;--line:rgba(197,160,90,.24);--serif:'Bodoni Moda',Georgia,serif;--sans:'Manrope',system-ui,sans-serif;--ok:#4ade80;--warn:#fbbf24;--err:#f87171;--info:#60a5fa}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ivory);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%;height:auto}a{color:inherit;text-decoration:none}button{font:inherit;background:none;border:none;color:inherit;cursor:pointer}input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--gold);color:var(--bg)}:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.container{width:100%;max-width:1440px;margin:0 auto;padding:0 20px}@media(min-width:640px){.container{padding:0 32px}}@media(min-width:1024px){.container{padding:0 48px}}
.eyebrow{font-size:10px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.display{font-family:var(--serif);font-weight:400;font-size:clamp(2.2rem,6vw,4rem);line-height:.95;letter-spacing:-.02em;color:var(--ivory)}
.gold-label{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-top:16px;font-weight:500}
.muted{color:var(--muted)}.small{font-size:12px;line-height:1.7}.lede{color:var(--muted);font-size:13px;line-height:1.7;max-width:560px;margin-top:20px}
.gold-line{border:0;height:1px;background:var(--line)}.gold-short{border:0;height:1px;width:64px;background:var(--gold);margin:24px 0}
.mt-3{margin-top:12px}.mt-4{margin-top:20px}.mb-4{margin-bottom:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 26px;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;border:1px solid var(--gold);transition:all .4s;cursor:pointer;white-space:nowrap}
.btn-gold{background:var(--gold);color:var(--bg)}.btn-gold:hover{background:transparent;color:var(--gold)}
.btn-outline{background:transparent;color:var(--ivory);border-color:rgba(244,240,232,.3)}.btn-outline:hover{border-color:var(--gold);color:var(--gold)}
.btn-danger{background:transparent;color:var(--err);border-color:rgba(248,113,113,.4)}.btn-danger:hover{background:rgba(248,113,113,.1)}
.btn-sm{padding:7px 12px;font-size:9px;letter-spacing:.15em}.btn.full{width:100%}.btn:disabled{opacity:.4;cursor:not-allowed}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;padding:8px;color:var(--ivory);transition:color .3s;position:relative;cursor:pointer}
.icon-btn:hover{color:var(--gold)}.icon-btn svg{width:20px;height:20px}
.badge{position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;background:var(--gold);color:var(--bg);font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;border-radius:50%}
.announce{background:var(--bg);border-bottom:1px solid rgba(197,160,90,.15);text-align:center;padding:10px 20px}
.announce p{font-size:9px;letter-spacing:.35em;text-transform:uppercase;color:var(--gold)}
.hdr{position:sticky;top:0;z-index:100;background:rgba(8,8,8,.9);backdrop-filter:blur(12px);border-bottom:1px solid rgba(197,160,90,.15)}
.hdr-in{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}@media(min-width:1024px){.hdr-in{height:80px}}
.logo{font-family:var(--serif);font-size:20px;letter-spacing:.18em;color:var(--ivory);white-space:nowrap}
.nav{display:none;align-items:center;gap:24px}@media(min-width:1024px){.nav{display:flex}}
.nav a,.nav-dd-toggle{font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ivory)}.nav a:hover,.nav-dd-toggle:hover,.nav a.active{color:var(--gold)}
.nav-dd{position:relative}.nav-dd-toggle{display:inline-flex;align-items:center;gap:4px}
.chev{width:12px;height:12px}
.nav-dd-menu{position:absolute;top:100%;left:0;margin-top:12px;min-width:220px;padding:8px;background:var(--bg2);border:1px solid var(--line);opacity:0;visibility:hidden;transform:translateY(-4px);transition:all .3s}
.nav-dd:hover .nav-dd-menu{opacity:1;visibility:visible;transform:translateY(0)}
.nav-dd-menu a{display:block;padding:10px 12px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}.nav-dd-menu a:hover{color:var(--gold)}
.hdr-actions{display:flex;align-items:center;gap:4px}.menu-btn{display:flex}@media(min-width:1024px){.menu-btn{display:none}}
.mobile-nav{position:fixed;inset:0;z-index:200;display:none}.mobile-nav.open{display:block}
.mobile-nav::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.7)}
.mobile-nav-panel{position:absolute;top:0;left:0;height:100%;width:86%;max-width:380px;background:var(--bg2);border-right:1px solid var(--line);padding:24px;overflow-y:auto}
.mobile-nav-head{display:flex;align-items:center;justify-content:space-between}
.mobile-links{display:flex;flex-direction:column;margin-top:24px}
.mobile-links a{padding:16px 0;border-bottom:1px solid rgba(197,160,90,.1);font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:var(--ivory)}
.hero{position:relative;min-height:86vh;display:flex;align-items:center;border-bottom:1px solid rgba(197,160,90,.15);overflow:hidden}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,8,8,.92),rgba(8,8,8,.3))}
.hero-content{position:relative;z-index:2;padding:96px 20px;max-width:720px}
.hero-title{font-family:var(--serif);font-weight:400;font-size:clamp(3rem,11vw,7rem);line-height:.9;letter-spacing:-.02em;color:var(--ivory);margin-top:20px}
.hero-sub{margin-top:24px;font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:rgba(244,240,232,.8);max-width:500px}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:40px}
.hero-foot{position:absolute;bottom:24px;left:0;right:0;z-index:2;display:flex;justify-content:space-between;font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:rgba(244,240,232,.5)}
.benefits{border-bottom:1px solid rgba(197,160,90,.15);background:var(--bg2)}
.benefits-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:rgba(197,160,90,.15)}
@media(min-width:640px){.benefits-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1024px){.benefits-grid{grid-template-columns:repeat(5,1fr)}}
.benefit{background:var(--bg2);padding:24px 16px}
.benefit-num{font-size:9px;letter-spacing:.3em;color:rgba(197,160,90,.6)}
.benefit h3{margin-top:12px;font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ivory)}
.benefit p{display:none;margin-top:8px;font-size:10px;line-height:1.7;color:var(--muted)}@media(min-width:640px){.benefit p{display:block}}
.section{padding:60px 0;border-bottom:1px solid rgba(197,160,90,.15)}
.section-head{margin-bottom:40px}.section-head.split{display:flex;flex-direction:column;gap:24px}
@media(min-width:1024px){.section-head.split{flex-direction:row;align-items:flex-end;justify-content:space-between}}
.section-head.center{text-align:center}.section-head .eyebrow{margin-bottom:16px}
.filters{display:flex;flex-wrap:wrap;gap:8px 20px}
.filter{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);cursor:pointer}.filter:hover{color:var(--ivory)}.filter.active{color:var(--gold);text-decoration:underline;text-underline-offset:4px}
.sort-label{display:inline-flex;align-items:center;gap:12px;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.sort-label select{background:transparent;border:1px solid rgba(197,160,90,.25);padding:8px 12px;font-size:10px;color:var(--ivory)}
.sort-label select option{background:var(--bg2)}
.cat-grid{display:grid;grid-template-columns:1fr;gap:20px;margin-top:48px}
@media(min-width:640px){.cat-grid{grid-template-columns:1fr 1fr}}
@media(min-width:1024px){.cat-grid{grid-template-columns:repeat(4,1fr)}}
.cat-card{position:relative;display:block;aspect-ratio:4/5;overflow:hidden;border:1px solid rgba(197,160,90,.1)}
.cat-card img{width:100%;height:100%;object-fit:cover;transition:transform .7s}.cat-card:hover img{transform:scale(1.05)}
.cat-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(8,8,8,.95))}
.cat-info{position:absolute;inset:auto 0 0 0;padding:20px}
.cat-num{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.cat-info h3{font-family:var(--serif);font-size:22px;color:var(--ivory);margin-top:8px}
.cat-info p{font-size:10px;line-height:1.6;color:rgba(244,240,232,.6);margin-top:6px}
.cat-cta{display:inline-block;margin-top:16px;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.prod-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:40px 20px;margin-top:32px}
@media(min-width:768px){.prod-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1280px){.prod-grid{grid-template-columns:repeat(4,1fr)}}
.prod-card .img-wrap{position:relative;aspect-ratio:3/4;overflow:hidden;border:1px solid rgba(197,160,90,.1);background:var(--bg2)}
.prod-card .img-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .5s}
.prod-card .img-wrap img.hover{opacity:0}
.prod-card:hover .img-wrap img.hover{opacity:1}.prod-card:hover .img-wrap img.main{opacity:0}
.prod-badge{position:absolute;top:12px;left:12px;z-index:2;padding:4px 10px;background:rgba(8,8,8,.85);border:1px solid rgba(197,160,90,.4);font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.wish-btn{position:absolute;top:12px;right:12px;z-index:2;width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:rgba(8,8,8,.7);border:1px solid rgba(197,160,90,.3);color:var(--ivory)}
.wish-btn.active{color:var(--gold)}.wish-btn svg{width:14px;height:14px}.wish-btn.active svg{fill:currentColor}
.prod-info{margin-top:14px}
.prod-cat{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.prod-name{display:block;margin-top:6px;font-size:13px;font-weight:500;color:var(--ivory)}.prod-name:hover{color:var(--gold)}
.prod-desc{margin-top:4px;font-size:10px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod-foot{display:flex;justify-content:space-between;margin-top:8px}
.prod-price{font-size:12px;font-weight:600;color:var(--ivory)}
.prod-status{font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:rgba(197,160,90,.7)}
.craft{display:grid;border-bottom:1px solid rgba(197,160,90,.15);background:var(--bg2)}
@media(min-width:1024px){.craft{grid-template-columns:1fr 1fr}}
.craft-img{position:relative;min-height:360px}.craft-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.craft-copy{padding:48px 24px}.craft-copy .eyebrow{margin-bottom:16px}.craft-copy h2{margin-bottom:24px}
.craft-copy p{max-width:480px;color:var(--muted);font-size:13px;line-height:1.7;margin-bottom:16px}
.heritage-grid{display:grid;gap:40px}
@media(min-width:1024px){.heritage-grid{grid-template-columns:.8fr 1.2fr;gap:64px}}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:32px}
.metrics span{font-family:var(--serif);font-size:22px;color:var(--gold)}
.metrics p{margin-top:8px;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.heritage-copy p{font-size:14px;line-height:1.8;color:var(--muted);margin-bottom:20px}
.heritage-copy .quote{border-left:1px solid rgba(197,160,90,.4);padding-left:20px;color:rgba(244,240,232,.85)}
.review-grid{display:grid;gap:20px;margin-top:40px}
@media(min-width:768px){.review-grid{grid-template-columns:repeat(3,1fr)}}
.review{display:flex;flex-direction:column;padding:24px;background:var(--bg2);border:1px solid rgba(197,160,90,.15)}
.review blockquote{flex:1;font-family:var(--serif);font-size:16px;line-height:1.6;color:rgba(244,240,232,.9)}
.review figcaption{margin-top:24px}
.review .name{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.review .meta{margin-top:4px;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.faq-grid{display:grid;gap:32px}
@media(min-width:1024px){.faq-grid{grid-template-columns:.7fr 1.3fr;gap:64px}}
.faq-list{border-top:1px solid rgba(197,160,90,.15);border-bottom:1px solid rgba(197,160,90,.15)}
.faq-item{border-bottom:1px solid rgba(197,160,90,.15)}.faq-item:last-child{border-bottom:0}
.faq-trigger{display:flex;justify-content:space-between;gap:24px;width:100%;padding:20px 0;text-align:left;font-size:13px;font-weight:500;color:var(--ivory)}
.faq-icon{flex-shrink:0;color:var(--gold);font-size:18px;transition:transform .3s}
.faq-item.open .faq-icon{transform:rotate(45deg)}
.faq-panel{max-height:0;overflow:hidden;transition:max-height .4s}
.faq-panel-inner{padding:0 0 20px 0;font-size:12px;line-height:1.8;color:var(--muted);max-width:640px}
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.form input,.form select,.form textarea{width:100%;padding:12px 14px;background:transparent;border:1px solid rgba(197,160,90,.25);color:var(--ivory);font-size:13px}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--gold);outline:none}
.form textarea{resize:vertical;min-height:100px}
.form select option{background:var(--bg2)}
.check{display:flex;align-items:center;gap:10px;font-size:10px;color:var(--muted);flex-direction:row!important}
.check input{width:auto;accent-color:var(--gold)}
.page-head{padding:48px 20px 0}
.page-head .eyebrow{margin-bottom:16px}
.toolbar{display:flex;flex-direction:column;gap:16px;border-top:1px solid rgba(197,160,90,.15);border-bottom:1px solid rgba(197,160,90,.15);padding:20px 0;margin-top:32px}
@media(min-width:640px){.toolbar{flex-direction:row;align-items:center;justify-content:space-between}}
.empty{border:1px solid rgba(197,160,90,.15);padding:48px 24px;margin-top:32px;text-align:center}
.empty p:first-child{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.modal,.drawer{position:fixed;inset:0;z-index:300;display:none}.modal.open,.drawer.open{display:block}
.modal-backdrop,.drawer-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.85)}
.modal-panel{position:relative;max-height:90vh;overflow:auto}
.search-panel{max-width:720px;margin:10vh auto 0;background:var(--bg2);border:1px solid var(--line)}
.search-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid rgba(197,160,90,.2)}
.search-head svg{width:18px;height:18px;color:var(--gold);flex-shrink:0}
#search-input{flex:1;background:transparent;border:none;color:var(--ivory);font-size:14px;outline:none}
.search-results{padding:8px;max-height:60vh;overflow-y:auto}
.search-item{display:flex;align-items:center;gap:16px;padding:12px;cursor:pointer}.search-item:hover{background:var(--bg3)}
.search-item img{width:48px;height:64px;object-fit:cover;background:var(--bg)}
.drawer-panel{position:absolute;top:0;right:0;height:100%;width:100%;max-width:440px;background:var(--bg2);border-left:1px solid rgba(197,160,90,.2);display:flex;flex-direction:column}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:20px;border-bottom:1px solid rgba(197,160,90,.2)}
.drawer-body{flex:1;overflow-y:auto;padding:20px}
.drawer-foot{border-top:1px solid rgba(197,160,90,.2);padding:20px}
.cart-item{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid rgba(197,160,90,.1)}
.cart-item img{width:72px;height:96px;object-fit:cover;flex-shrink:0;background:var(--bg)}
.cart-item-info{flex:1;display:flex;flex-direction:column}
.cart-item-top{display:flex;justify-content:space-between;gap:8px}
.cart-item-name{font-size:12px;color:var(--ivory)}
.cart-item-meta{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.cart-item-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.qty{display:flex;align-items:center;border:1px solid rgba(197,160,90,.2)}
.qty button{padding:6px 10px;color:var(--ivory)}.qty button:hover{color:var(--gold)}
.qty span{min-width:32px;text-align:center;font-size:10px}
.cart-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px}
.cart-empty p{margin-top:16px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.cart-summary{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:4px 0}
.cart-summary strong{color:var(--ivory);font-size:12px;font-weight:400}
.pd-wrap{display:grid;gap:32px;padding:48px 0}
@media(min-width:1024px){.pd-wrap{grid-template-columns:1fr 1fr;gap:56px;padding:64px 0}}
.pd-main{position:relative;aspect-ratio:3/4;overflow:hidden;border:1px solid rgba(197,160,90,.1);background:var(--bg2)}
.pd-main img,.pd-main video{width:100%;height:100%;object-fit:cover}
.pd-thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.pd-thumb{aspect-ratio:1;overflow:hidden;border:1px solid rgba(197,160,90,.15);cursor:pointer;position:relative;background:var(--bg)}
.pd-thumb.active{border-color:var(--gold)}
.pd-thumb img{width:100%;height:100%;object-fit:cover}
.pd-thumb .video-badge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5);color:#fff;font-size:20px}
.pd-info .eyebrow{margin-bottom:12px}
.pd-info h1{font-family:var(--serif);font-size:clamp(26px,4vw,38px);font-weight:400;line-height:1.1;color:var(--ivory);margin-bottom:12px}
.pd-rating{display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:12px;color:var(--muted)}
.pd-rating .stars{color:var(--gold);letter-spacing:2px}
.pd-price{font-size:20px;color:var(--gold);margin-bottom:24px}
.pd-info .desc{font-size:14px;line-height:1.7;color:var(--muted);margin-bottom:24px}
.pd-section{border-top:1px solid rgba(197,160,90,.15);padding-top:20px;margin-top:20px}
.pd-section .eyebrow{margin-bottom:10px}
.pd-section p{font-size:12px;line-height:1.7;color:var(--muted)}
.pd-sizes{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pd-size{padding:8px 16px;border:1px solid rgba(197,160,90,.2);font-size:11px;color:rgba(244,240,232,.7);cursor:pointer;transition:all .2s;background:none}
.pd-size:hover,.pd-size.active{border-color:var(--gold);color:var(--gold)}
.pd-size.out{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.pd-actions{margin-top:24px;display:flex;flex-direction:column;gap:10px}
.review-card{border:1px solid var(--line);padding:16px;margin-bottom:12px;background:var(--bg2)}
.review-card .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.review-card .stars{color:var(--gold);letter-spacing:2px}
.review-card .author{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold)}
.review-card .date{font-size:10px;color:var(--muted)}
.review-card p{font-size:13px;line-height:1.7;color:var(--ivory)}
.star-picker{display:flex;gap:4px;font-size:26px;cursor:pointer;margin-bottom:8px}
.star-picker span{color:var(--muted);transition:color .2s}
.star-picker span.active,.star-picker span:hover{color:var(--gold)}
.past-order{border:1px solid var(--line);padding:16px;margin-bottom:12px;background:var(--bg2)}
.past-order-head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.past-order-num{font-size:13px;color:var(--ivory);font-weight:600}

function migrate(d){
  if(!d.products) return d;
  d.products.forEach(p=>{
    if(!p.media){
      p.media=[];
      if(p.image) p.media.push({type:'image',url:p.image});
      if(p.hoverImage && p.hoverImage!==p.image) p.media.push({type:'image',url:p.hoverImage});
      if(p.media.length===0) p.media.push({type:'image',url:'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=1000&q=80'});
    }
  });
  if(!d.reviews) d.reviews=[];
  return d;
}

const DB={
  read(){try{const r=localStorage.getItem(DB_KEY);return migrate(r?JSON.parse(r):seed());}catch{return migrate(seed());}},
  write(d){localStorage.setItem(DB_KEY,JSON.stringify(d));},
  reset(){localStorage.removeItem(DB_KEY);return migrate(seed());}
};

function toast(msg,type='success'){
  const el=document.createElement('div');
  el.className='toast'+(type==='error'?' error':'');
  el.textContent=msg;
  $('#toasts').appendChild(el);
  setTimeout(()=>el.remove(),3200);
}

function orderNo(){
  const d=new Date();
  return 'HY-'+d.getFullYear().toString().slice(2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+Math.floor(1000+Math.random()*9000);
}

/* ---- CART / WISHLIST ---- */
function addToCart(pid,size,qty=1){
  const p=findProd(pid);
  if(!p) return toast('Product not found','error');
  if(!size && p.sizes?.length) return toast('Select a size','error');
  if(p.status!=='active') return toast('Unavailable','error');
  if((p.stock?.[size]??0)<=0) return toast('Out of stock','error');
  const ex=cart.find(i=>i.productId===pid&&i.size===size);
  if(ex) ex.qty+=qty; else cart.push({productId:pid,size,qty});
  saveCart(); render(); toast('Added to bag'); openCart();
}
function removeFromCart(i){cart.splice(i,1);saveCart();render();}
function setQty(i,q){if(q<1)return removeFromCart(i);cart[i].qty=q;saveCart();render();}
function cartCount(){return cart.reduce((s,i)=>s+i.qty,0);}
function cartSubtotal(){return cart.reduce((s,i)=>{const p=findProd(i.productId);return s+(p?p.price*i.qty:0);},0);}
function toggleWish(id){
  const i=wishlist.indexOf(id);
  if(i>=0) wishlist.splice(i,1); else wishlist.push(id);
  saveWish(); render();
  toast(wishlist.includes(id)?'Added to wishlist':'Removed from wishlist');
}

function getRoute(){
  const h=location.hash.replace(/^#\/?/,'')||'';
  const [path,qs]=h.split('?');
  return {path:path||'',params:new URLSearchParams(qs||'')};
}
const isAdminRoute=()=>getRoute().path.startsWith('admin2512');

  if(isAdminRoute()) renderAdmin(); else renderStorefront();

      <div class="mobile-nav-head"><span class="logo">${esc(db.settings.brandName)}</span><button class="icon-btn" id="menu-close">✕</button></div>
      <hr class="gold-line"/><nav class="mobile-links">
        <a href="#/">Home</a><a href="#/shop">Shop</a>
        ${db.categories.map(c=>`<a href="#/shop?cat=${c.slug}">${esc(c.name)}</a>`).join('')}
        <a href="#/track">Track Order</a><a href="#/wishlist">Wishlist</a><a href="#/about">About</a><a href="#/contact">Contact</a>
      </nav>
    </div></div>`;

  let body='';
  if(path===''||path==='home') body=homeView();
  else if(path==='shop') body=shopView(params);
  else if(path==='wishlist') body=wishlistView();
  else if(path==='track') body=trackView();
  else if(path==='about') body=aboutView();
  else if(path==='contact') body=contactView();
  else if(path==='checkout') body=checkoutView();
  else if(path==='order-success') body=orderSuccessView(params);
  else if(path.startsWith('product/')) body=productView(path.slice(8));
  else body=`<div class="container" style="padding:120px 20px;text-align:center"><h2 class="display">404</h2><a href="#/" class="btn btn-outline mt-4">Return Home</a></div>`;

  $('#app').innerHTML=header+'<main>'+body+'</main>'+footerView();
  bindStorefront();
  window.scrollTo({top:0,behavior:'instant'});
}

function shopView(params){
  const catSlug=params.get('cat')||'all';
  const sort=params.get('sort')||'featured';
  let list=db.products.filter(p=>p.status==='active');
  if(catSlug!=='all'){const c=db.categories.find(x=>x.slug===catSlug);if(c)list=list.filter(p=>p.categoryId===c.id);}
  if(sort==='price-asc')list.sort((a,b)=>a.price-b.price);
  else if(sort==='price-desc')list.sort((a,b)=>b.price-a.price);
  else if(sort==='newest')list.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  else list.sort((a,b)=>Number(b.featured)-Number(a.featured));
  return `
    <div class="container page-head"><p class="eyebrow">SHOP BY CATEGORY</p><h1 class="display">THE ANTHOLOGY</h1><p class="lede">${list.length} ${list.length===1?'piece':'pieces'}</p></div>
    <div class="container" style="padding-bottom:64px">
      <div class="toolbar">
        <div class="filters">
          <button class="filter ${catSlug==='all'?'active':''}" data-filter="all">ALL CAPSULES</button>
          ${db.categories.map(c=>`<button class="filter ${catSlug===c.slug?'active':''}" data-filter="${c.slug}">${esc(c.label)}</button>`).join('')}
        </div>
        <label class="sort-label">Sort <select id="shop-sort"><option value="featured" ${sort==='featured'?'selected':''}>Featured</option><option value="newest" ${sort==='newest'?'selected':''}>Newest</option><option value="price-asc" ${sort==='price-asc'?'selected':''}>Price ↑</option><option value="price-desc" ${sort==='price-desc'?'selected':''}>Price ↓</option></select></label>
      </div>
      ${list.length===0?'<div class="empty"><p>No pieces found</p></div>':`<div class="prod-grid">${list.map(productCard).join('')}</div>`}
    </div>`;
}

function productView(slug){
  const p=prodBySlug(slug);
  if(!p) return '<div class="container" style="padding:120px 20px;text-align:center"><h2>Not found</h2></div>';
  const cat=findCat(p.categoryId);
  const size=selSize[p.id]||'';
  const mediaIdx=selMedia[p.id]||0;
  const media=p.media||[];
  const current=media[mediaIdx]||media[0];
  const stock=p.stock||{};
  const inStock=Object.values(stock).some(v=>v>0);
  const avg=prodAvg(p.id);
  const revs=prodReviews(p.id);
  const related=db.products.filter(x=>x.categoryId===p.categoryId&&x.id!==p.id&&x.status==='active').slice(0,4);

  const mediaMain=current?.type==='video'
    ? `<video src="${esc(current.url)}" controls playsinline style="width:100%;height:100%;object-fit:cover"></video>`
    : `<img src="${esc(current?.url||'')}" alt="${esc(p.name)}"/>`;

  const thumbs=media.map((m,i)=>{
    if(m.type==='video'){
      return `<div class="pd-thumb ${i===mediaIdx?'active':''}" onclick="switchMedia('${p.id}',${i})"><div class="video-badge">▶</div></div>`;
    }
    return `<div class="pd-thumb ${i===mediaIdx?'active':''}" onclick="switchMedia('${p.id}',${i})"><img src="${esc(m.url)}" alt=""/></div>`;
  }).join('');

  const starsStr=avg>0?`${'★'.repeat(Math.round(avg))}${'☆'.repeat(5-Math.round(avg))} <span>${avg.toFixed(1)}</span> <span>(${revs.length} review${revs.length===1?'':'s'})</span>`:'No reviews yet';

  const reviewList=revs.map(r=>`
    <div class="review-card">
      <div class="header"><span class="author">${esc(r.name)}</span><span class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</span></div>
      <p>${esc(r.quote)}</p>
      <p class="date" style="margin-top:8px">${new Date(r.createdAt).toLocaleDateString()}</p>
    </div>`).join('')||'<p class="muted small">Be the first to review this piece.</p>';

  return `
    <div class="container">
      <div class="pd-wrap">
        <div>
          <div class="pd-main">${mediaMain}</div>
          <div class="pd-thumbs">${thumbs}</div>
        </div>
        <div class="pd-info">
          <p class="eyebrow">${esc(cat?.name||'')}</p>
          <h1>${esc(p.name)}</h1>
          <div class="pd-rating"><span class="stars">${starsStr}</span></div>
          <p class="pd-price">${fmt(p.price)} ${p.mrp>p.price?`<span style="text-decoration:line-through;color:var(--muted);font-size:14px">${fmt(p.mrp)}</span>`:''}</p>
          <p class="desc">${esc(p.description)}</p>
          <div class="pd-section"><p class="eyebrow">SIZES</p>
            <div class="pd-sizes">${p.sizes.map(s=>`<button class="pd-size ${size===s?'active':''} ${(stock[s]||0)<=0?'out':''}" data-size="${esc(s)}" ${(stock[s]||0)<=0?'disabled':''}>${esc(s)}</button>`).join('')}</div>
          </div>
          <div class="pd-section"><p class="eyebrow">DETAILS</p><p>${esc(p.details)}</p></div>
          <div class="pd-section"><p class="eyebrow">CARE</p><p>${esc(p.care)}</p></div>
          <div class="pd-actions">
            <button class="btn btn-gold full" id="add-cart" ${!inStock?'disabled':''}>${inStock?'Add to Bag':'Out of Stock'}</button>
            <button class="btn btn-outline full" data-wish="${p.id}">${wishlist.includes(p.id)?'Saved':'Add to Wishlist'}</button>
          </div>
        </div>
      </div>
      <div style="border-top:1px solid var(--line);padding:32px 0;margin-bottom:64px">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px">
          <h2 class="display" style="font-size:1.5rem">REVIEWS</h2>
          <button class="btn btn-outline btn-sm" onclick="document.getElementById('review-form-wrap').scrollIntoView({behavior:'smooth'})">Write a Review</button>
        </div>
        <div>${reviewList}</div>
        <div id="review-form-wrap" style="margin-top:32px;border:1px solid var(--line);padding:20px;background:var(--bg2)">
          <h3 class="eyebrow mb-4">SHARE YOUR FEEDBACK</h3>
          <form class="form" id="review-form" data-pid="${p.id}">
            <div class="row" style="display:grid;grid-template-columns:1fr;gap:12px">
              <label>Your Name<input name="name" required minlength="2"/></label>
              <label>Email (not shown publicly)<input type="email" name="email" required/></label>
            </div>
            <label>Rating
              <div class="star-picker" id="star-picker">
                <span data-r="1">★</span><span data-r="2">★</span><span data-r="3">★</span><span data-r="4">★</span><span data-r="5">★</span>
              </div>
              <input type="hidden" name="rating" value="5"/>
            </label>
            <label>Your Feedback<textarea name="quote" required minlength="10" placeholder="What did you think of this piece?"></textarea></label>
            <button type="submit" class="btn btn-gold">Submit Review</button>
          </form>
        </div>
      </div>
      ${related.length?`<div style="margin-bottom:64px"><h2 class="display mb-4" style="font-size:1.5rem">RELATED PIECES</h2><div class="prod-grid">${related.map(productCard).join('')}</div></div>`:''}
    </div>`;
}

function productCard(p){
  const cat=findCat(p.categoryId);
  const stock=p.stock||{};
  const inStock=Object.values(stock).some(v=>v>0);
  const main=prodPrimary(p);
  const hover=prodHover(p);
  const avg=prodAvg(p.id);
  return `
    <article class="prod-card">
      <div class="img-wrap">
        <a href="#/product/${esc(p.slug)}">
          <img class="main" src="${esc(main)}" alt="${esc(p.name)}" loading="lazy"/>
          ${hover!==main?`<img class="hover" src="${esc(hover)}" alt="" loading="lazy"/>`:''}
        </a>
        ${p.isNew?'<span class="prod-badge">NEW</span>':''}
        ${!inStock?'<span class="prod-badge" style="top:40px;color:var(--err);border-color:rgba(248,113,113,.4)">SOLD OUT</span>':''}
        <button class="wish-btn ${wishlist.includes(p.id)?'active':''}" data-wish="${p.id}" aria-label="Wishlist">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21.2l7.8-7.8 1-1a5.5 5.5 0 000-7.8z"/></svg>
        </button>
      </div>
      <div class="prod-info">
        <p class="prod-cat">${esc(cat?.name||'')}</p>
        <a class="prod-name" href="#/product/${esc(p.slug)}">${esc(p.name)}</a>
        <p class="prod-desc">${esc(p.description)}</p>
        ${avg>0?`<p style="font-size:11px;color:var(--gold);margin-top:4px">${'★'.repeat(Math.round(avg))} <span style="color:var(--muted)">(${prodReviews(p.id).length})</span></p>`:''}
        <div class="prod-foot"><span class="prod-price">${fmt(p.price)}</span><span class="prod-status">${inStock?'IN STOCK':'SOLD OUT'}</span></div>
      </div>

}

/* ---- Global media switcher (used in product detail) ---- */
window.switchMedia=function(pid,idx){
  selMedia[pid]=idx;
  const p=findProd(pid);
  const m=p.media[idx];
  const main=document.querySelector('.pd-main');
  if(main){
    main.innerHTML=m.type==='video'
      ?`<video src="${esc(m.url)}" controls playsinline autoplay style="width:100%;height:100%;object-fit:cover"></video>`
      :`<img src="${esc(m.url)}" alt="${esc(p.name)}"/>`;
  }
  document.querySelectorAll('.pd-thumb').forEach((t,i)=>t.classList.toggle('active',i===idx));
};

/* ---- STOREFRONT BINDINGS ---- */
function bindStorefront(){
  $('#menu-open')?.addEventListener('click',()=>$('#mobile-nav')?.classList.add('open'));
  $('#menu-close')?.addEventListener('click',()=>$('#mobile-nav')?.classList.remove('open'));
  $$('#mobile-nav a').forEach(a=>a.addEventListener('click',()=>$('#mobile-nav')?.classList.remove('open')));

  $('#search-open')?.addEventListener('click',()=>{
    const m=document.createElement('div');
    m.className='modal open';m.id='search-modal';
    m.innerHTML=`<div class="modal-backdrop" data-close></div><div class="modal-panel search-panel"><div class="search-head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="search-input" placeholder="Search..." autofocus/><button class="icon-btn" data-close>✕</button></div><div class="search-results" id="search-results"></div></div>`;
    document.body.appendChild(m);
    const input=$('#search-input'),results=$('#search-results');
    const run=q=>{
      const list=q?db.products.filter(p=>p.name.toLowerCase().includes(q.toLowerCase())||p.description.toLowerCase().includes(q.toLowerCase())):db.products.slice(0,4);
      results.innerHTML=list.length===0?'<div style="padding:32px;text-align:center;color:var(--muted);font-size:12px">No results</div>':list.map(p=>`<div class="search-item" onclick="location.hash='#/product/${p.slug}';this.closest('.modal').remove()"><img src="${prodPrimary(p)}"/><div><p style="font-size:12px">${esc(p.name)}</p><p style="font-size:9px;color:var(--gold)">${esc(findCat(p.categoryId)?.name||'')}</p></div><span style="margin-left:auto;font-size:12px;color:var(--muted)">${fmt(p.price)}</span></div>`).join('');
    };
    run('');
    input.addEventListener('input',e=>run(e.target.value));
    m.querySelectorAll('[data-close]').forEach(el=>el.addEventListener('click',()=>m.remove()));
    setTimeout(()=>input.focus(),50);
  });

  $('#cart-open')?.addEventListener('click',openCart);

  $$('[data-wish]').forEach(btn=>btn.addEventListener('click',e=>{
    e.preventDefault();e.stopPropagation();toggleWish(btn.dataset.wish);
  }));

  $$('[data-filter]').forEach(btn=>btn.addEventListener('click',()=>{
    const c=btn.dataset.filter;
    location.hash='#/shop'+(c==='all'?'':'?cat='+c);
  }));

  $('#shop-sort')?.addEventListener('change',e=>{
    const hash=location.hash.split('?')[0];
    const cat=new URLSearchParams(location.hash.split('?')[1]||'').get('cat');
    location.hash=hash+'?sort='+e.target.value+(cat?'&cat='+cat:'');
  });

  $('#featured-sort')?.addEventListener('change',e=>{
    const sort=e.target.value;
    let list=db.products.filter(p=>p.featured&&p.status==='active').slice(0,8);
    if(sort==='price-asc')list.sort((a,b)=>a.price-b.price);
    else if(sort==='price-desc')list.sort((a,b)=>b.price-a.price);
    else if(sort==='newest')list.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    $('#featured-grid').innerHTML=list.map(productCard).join('');
    $$('#featured-grid [data-wish]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();toggleWish(b.dataset.wish);}));
  });

  $$('[data-faq]').forEach(btn=>btn.addEventListener('click',()=>{
    const item=btn.closest('.faq-item'),panel=item.querySelector('.faq-panel'),isOpen=item.classList.contains('open');
    $$('.faq-item').forEach(i=>{i.classList.remove('open');i.querySelector('.faq-panel').style.maxHeight=null;});
    if(!isOpen){item.classList.add('open');panel.style.maxHeight=panel.scrollHeight+'px';}
  }));

  $('#contact-form')?.addEventListener('submit',e=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    db.contactSubmissions=db.contactSubmissions||[];
    db.contactSubmissions.push({id:uid(),name:fd.get('name'),email:fd.get('email'),message:fd.get('message'),createdAt:Date.now()});
    save();toast('Message sent');e.target.reset();
  });

  // Size selection
  $$('[data-size]').forEach(btn=>btn.addEventListener('click',()=>{
    const pid=btn.closest('.pd-info').querySelector('[data-wish]')?.dataset.wish;
    if(!pid)return;
    selSize[pid]=btn.dataset.size;
    render();
  }));

  $('#add-cart')?.addEventListener('click',()=>{
    const pid=document.querySelector('[data-wish]')?.dataset.wish;
    if(!pid)return;
    addToCart(pid,selSize[pid]||'');
  });

  // Star picker
  $$('#star-picker span').forEach(star=>{
    star.addEventListener('click',()=>{
      const r=+star.dataset.r;
      const form=star.closest('form');
      form.querySelector('input[name=rating]').value=r;
      $$('#star-picker span').forEach((s,i)=>s.classList.toggle('active',i<r));
    });
  });
  // Default to 5 stars on load
  $$('#star-picker span').forEach((s,i)=>s.classList.toggle('active',true));

  // Review form
  $('#review-form')?.addEventListener('submit',e=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    const rating=+fd.get('rating')||5;
    if(rating<1||rating>5)return toast('Select a rating','error');
    db.reviews.push({
      id:uid(),productId:e.target.dataset.pid,
      name:fd.get('name'),email:fd.get('email'),
      rating,quote:fd.get('quote'),
      createdAt:Date.now(),approved:true
    });
    save();toast('Review submitted. Thank you!');render();
  });

  // Checkout
  $('#checkout-form')?.addEventListener('submit',e=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    const items=cart.map(i=>{const p=findProd(i.productId);return {productId:i.productId,name:p?.name||'',price:p?.price||0,size:i.size,qty:i.qty};});
    const subtotal=cartSubtotal(),total=subtotal+db.settings.shippingFee;
    const order={
      id:uid(),orderNo:orderNo(),items,subtotal,shipping:db.settings.shippingFee,total,
      customer:{name:fd.get('name'),email:fd.get('email'),phone:fd.get('phone')},
      shipping_addr:{address:fd.get('address'),city:fd.get('city'),state:fd.get('state'),pincode:fd.get('pincode')},
      payment:fd.get('payment'),status:'pending',createdAt:Date.now()
    };
    db.orders.push(order);
    items.forEach(it=>{const p=findProd(it.productId);if(p?.stock?.[it.size]!==undefined)p.stock[it.size]=Math.max(0,p.stock[it.size]-it.qty);});
    let cust=db.customers.find(c=>c.email===order.customer.email);
    if(!cust){cust={email:order.customer.email,name:order.customer.name,phone:order.customer.phone,orders:0,totalSpent:0};db.customers.push(cust);}
    cust.orders++;cust.totalSpent+=total;
    save();
    cart=[];saveCart();
    location.hash='#/order-success?order='+order.id;
  });
}

function openCart(){
  const total=cartSubtotal();
  const body=cart.length===0
    ?`<div class="cart-empty"><p>Your bag is empty</p></div>`
    :cart.map((i,idx)=>{
      const p=findProd(i.productId);if(!p)return '';
      return `<div class="cart-item"><img src="${prodPrimary(p)}"/><div class="cart-item-info"><div class="cart-item-top"><div><p class="cart-item-name">${esc(p.name)}</p><p class="cart-item-meta">Size ${esc(i.size)}</p></div><button class="icon-btn" data-rm="${idx}" style="font-size:14px">✕</button></div><div class="cart-item-bottom"><div class="qty"><button data-qty="${idx}" data-d="-1">−</button><span>${i.qty}</span><button data-qty="${idx}" data-d="1">+</button></div><span style="font-size:12px">${fmt(p.price*i.qty)}</span></div></div></div>`;
    }).join('');
  const foot=cart.length===0?'':`<div class="cart-summary"><span>Subtotal</span><strong>${fmt(total)}</strong></div><a href="#/checkout" class="btn btn-gold full mt-3" style="display:block;text-align:center">Proceed to Checkout</a>`;
  const d=document.createElement('div');
  d.className='drawer open';d.id='cart-drawer';
  d.innerHTML=`<div class="drawer-backdrop" data-close></div><aside class="drawer-panel"><div class="drawer-head"><h2 class="eyebrow">Your Bag (${cartCount()})</h2><button class="icon-btn" data-close>✕</button></div><div class="drawer-body">${body}</div><div class="drawer-foot">${foot}</div></aside>`;
  document.body.appendChild(d);
  d.querySelectorAll('[data-close]').forEach(el=>el.addEventListener('click',()=>d.remove()));
  d.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{removeFromCart(+b.dataset.rm);d.remove();openCart();}));
  d.querySelectorAll('[data-qty]').forEach(b=>b.addEventListener('click',()=>{setQty(+b.dataset.qty,cart[+b.dataset.qty].qty+ +b.dataset.d);d.remove();openCart();}));
  d.querySelectorAll('a[href="#/checkout"]').forEach(a=>a.addEventListener('click',()=>d.remove()));
}

      </aside>
      <main class="admin-main" id="admin-main"></main>
    </div>`;
  $$('[data-view]').forEach(b=>b.addEventListener('click',()=>{location.hash='#admin2512/'+b.dataset.view;}));
  $('#admin-logout')?.addEventListener('click',()=>{adminAuthed=false;sessionStorage.removeItem(SESSION_KEY);render();});
  const main=$('#admin-main');
  if(currentAdminView==='dashboard') main.innerHTML=adminDashboard();
  else if(currentAdminView==='products') main.innerHTML=adminProducts();
  else if(currentAdminView==='categories') main.innerHTML=adminCategories();

  else if(currentAdminView==='settings') main.innerHTML=adminSettings();
  bindAdmin();
}

const ADMIN_LOCAL_NOTE=`<div class="warn-banner">⚠️ This admin panel reads <strong>only this browser's localStorage</strong>. Orders placed on other devices (e.g. a phone) will not appear here. To share data across devices you must connect a backend server.</div>`;

function adminDashboard(){
  const orders=db.orders;
  const revenue=orders.reduce((s,o)=>s+o.total,0);
  const pending=orders.filter(o=>o.status==='pending').length;
  const days=[];
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const key=d.toISOString().slice(0,10);const v=orders.filter(o=>new Date(o.createdAt).toISOString().slice(0,10)===key).reduce((s,o)=>s+o.total,0);days.push({label:d.toLocaleDateString('en',{weekday:'short'}),value:v});}
  const max=Math.max(...days.map(d=>d.value),1);
  const bars=days.map((d,i)=>{const h=(d.value/max)*160;return `<rect x="${i*14+2}%" y="${160-h}" width="10%" height="${h}" fill="#C5A05A" opacity=".85"/><text x="${i*14+7}%" y="174" font-size="9" fill="#A5A19A" text-anchor="middle">${d.label}</text>`;}).join('');
  const recent=orders.slice(-5).reverse();
  return ADMIN_LOCAL_NOTE+`
    <div class="admin-head"><div><h1>Dashboard</h1><p>Overview</p></div></div>
    <div class="kpi-grid">
      <div class="kpi"><div class="label">Revenue</div><div class="value">${fmt(revenue)}</div></div>
      <div class="kpi"><div class="label">Orders</div><div class="value">${orders.length}</div></div>
      <div class="kpi"><div class="label">Pending</div><div class="value" style="color:var(--warn)">${pending}</div></div>
      <div class="kpi"><div class="label">Customers</div><div class="value">${db.customers.length}</div></div>
    </div>
    <div class="card"><h3>Revenue — Last 7 Days</h3><svg viewBox="0 0 100 190" style="width:100%;height:200px" preserveAspectRatio="none">${bars}</svg></div>
    <div class="card"><h3>Recent Orders</h3>
      ${recent.length===0?'<p style="color:var(--muted);font-size:12px">No orders on this device yet.</p>':`<div class="table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead><tbody>${recent.map(o=>`<tr><td>${esc(o.orderNo)}</td><td>${esc(o.customer.name)}</td><td>${fmt(o.total)}</td><td><span class="pill pill-${o.status}">${o.status}</span></td></tr>`).join('')}</tbody></table></div>`}
    </div>`;
}

function adminAnalytics(){
  const orders=db.orders;
  const sales={};
  orders.forEach(o=>o.items.forEach(it=>{sales[it.productId]=(sales[it.productId]||0)+it.qty;}));
  const top=Object.entries(sales).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([pid,qty])=>({p:findProd(pid),qty})).filter(x=>x.p);
  const pairs={};
  orders.forEach(o=>{const ids=o.items.map(i=>i.productId);for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const k=[ids[i],ids[j]].sort().join('|');pairs[k]=(pairs[k]||0)+1;}});
  const recs=Object.entries(pairs).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,c])=>{const [a,b]=k.split('|');return {a:findProd(a),b:findProd(b),count:c};}).filter(x=>x.a&&x.b);
  const aov=orders.length?orders.reduce((s,o)=>s+o.total,0)/orders.length:0;
  return `<div class="admin-head"><div><h1>Analytics</h1></div></div>
    <div class="kpi-grid">
      <div class="kpi"><div class="label">Revenue</div><div class="value">${fmt(orders.reduce((s,o)=>s+o.total,0))}</div></div>
      <div class="kpi"><div class="label">Orders</div><div class="value">${orders.length}</div></div>
      <div class="kpi"><div class="label">AOV</div><div class="value">${fmt(aov)}</div></div>
      <div class="kpi"><div class="label">Reviews</div><div class="value">${db.reviews.length}</div></div>
    </div>
    <div class="card"><h3>Top Selling</h3>${top.length===0?'<p style="color:var(--muted);font-size:12px">No sales yet.</p>':`<div class="table-wrap"><table><thead><tr><th>Product</th><th>Units</th><th>Revenue</th></tr></thead><tbody>${top.map(t=>`<tr><td>${esc(t.p.name)}</td><td>${t.qty}</td><td>${fmt(t.p.price*t.qty)}</td></tr>`).join('')}</tbody></table></div>`}</div>
    <div class="card"><h3>Frequently Bought Together</h3>${recs.length===0?'<p style="color:var(--muted);font-size:12px">Not enough order data.</p>':recs.map(r=>`<div style="padding:12px 0;border-bottom:1px solid rgba(197,160,90,.1);font-size:12px">${esc(r.a.name)} + ${esc(r.b.name)} — <strong style="color:var(--gold)">${r.count}×</strong></div>`).join('')}</div>
    <div class="card"><h3>Low Stock</h3>${db.products.filter(p=>Object.values(p.stock||{}).some(v=>v<3)).map(p=>`<div style="padding:8px 0;font-size:12px">${esc(p.name)} — ${Object.entries(p.stock||{}).filter(([k,v])=>v<3).map(([k,v])=>`${k}:${v}`).join(', ')}</div>`).join('')||'<p style="color:var(--muted);font-size:12px">All well-stocked.</p>'}</div>`;
}

    <form class="admin-form" id="settings-form">
      <h3 class="eyebrow mb-4">BRAND</h3>
      <div class="row"><label>Brand Name<input name="brandName" value="${esc(s.brandName)}" required/></label><label>Tagline<input name="tagline" value="${esc(s.tagline)}"/></label></div>
      <div class="row full"><label>Announcement<input name="announcement" value="${esc(s.announcement)}"/></label></div>
      <h3 class="eyebrow mb-4 mt-4">HERO</h3>
      <div class="row full"><label>Hero Image<input name="heroImage" value="${esc(s.heroImage)}"/></label></div>
      <div class="row"><label>Hero Title<input name="heroTitle" value="${esc(s.heroTitle)}"/></label><label>Hero Subtitle<input name="heroSubtitle" value="${esc(s.heroSubtitle)}"/></label></div>
      <div class="row"><label>CTA1 Text<input name="heroCta1Text" value="${esc(s.heroCta1Text)}"/></label><label>CTA1 Link<input name="heroCta1Link" value="${esc(s.heroCta1Link)}"/></label></div>
      <div class="row"><label>CTA2 Text<input name="heroCta2Text" value="${esc(s.heroCta2Text)}"/></label><label>CTA2 Link<input name="heroCta2Link" value="${esc(s.heroCta2Link)}"/></label></div>
      <h3 class="eyebrow mb-4 mt-4">CONTACT</h3>
      <div class="row full"><label>Footer Text<textarea name="footerText">${esc(s.footerText)}</textarea></label></div>
      <div class="row"><label>Email<input name="contactEmail" value="${esc(s.contactEmail)}"/></label><label>Phone<input name="contactPhone" value="${esc(s.contactPhone)}"/></label></div>
      <div class="row"><label>Address<input name="contactAddress" value="${esc(s.contactAddress)}"/></label><label>Instagram<input name="instagram" value="${esc(s.instagram)}"/></label></div>
      <div class="row full"><label>Instagram URL<input name="instagramUrl" value="${esc(s.instagramUrl)}"/></label></div>
      <h3 class="eyebrow mb-4 mt-4">COMMERCE</h3>
      <div class="row"><label>Currency<input name="currencySymbol" value="${esc(s.currencySymbol)}"/></label><label>Shipping Fee<input name="shippingFee" type="number" value="${s.shippingFee}"/></label></div>
      <div class="row"><label class="check"><input type="checkbox" name="codEnabled" ${s.codEnabled?'checked':''}/> Enable COD</label><label class="check"><input type="checkbox" name="upiEnabled" ${s.upiEnabled?'checked':''}/> Enable UPI</label></div>
      <div class="admin-actions"><button type="submit" class="btn btn-gold">Save Settings</button></div>
    </form>
    <div class="card mt-4"><h3>Danger Zone</h3><p style="font-size:12px;color:var(--muted);margin-bottom:12px">Reset all data on this device. Cannot be undone.</p><button class="btn btn-danger btn-sm" id="reset-db">Reset Database</button></div>`;
}

/* -- Editing media state -- */
let editingMedia=[];

function renderMediaEditorHTML(){
  return `<div id="media-editor">
    <p style="font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:8px">Media (${editingMedia.length})</p>
    ${editingMedia.map((m,i)=>`
      <div class="media-row">
        <span class="type">${m.type.toUpperCase()}</span>
        ${m.type==='image'?`<img class="media-preview" src="${esc(m.url)}"/>`:`<div class="media-preview" style="display:flex;align-items:center;justify-content:center;color:var(--gold)">▶</div>`}
        <input value="${esc(m.url)}" onchange="editingMedia[${i}].url=this.value;renderMediaEditorRefresh()"/>
        <button type="button" class="btn btn-sm btn-danger" onclick="editingMedia.splice(${i},1);renderMediaEditorRefresh()">Del</button>
      </div>`).join('')}
    <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
      <select id="new-media-type" style="flex:0 0 100px;padding:8px;background:var(--bg);border:1px solid var(--line);color:var(--ivory)"><option value="image">Image</option><option value="video">Video</option></select>
      <input id="new-media-url" placeholder="Media URL" style="flex:1;min-width:200px;padding:8px;background:var(--bg);border:1px solid var(--line);color:var(--ivory)"/>
      <button type="button" class="btn btn-sm btn-outline" onclick="addMedia()">+ Add</button>
    </div>
  </div>`;
}

window.renderMediaEditorRefresh=function(){
  const el=document.getElementById('media-editor');
  if(el){const wrap=el.parentElement;const html=renderMediaEditorHTML();el.outerHTML=html;}
};

window.addMedia=function(){
  const type=document.getElementById('new-media-type').value;
  const url=document.getElementById('new-media-url').value.trim();
  if(!url)return toast('Enter URL','error');
  editingMedia.push({type,url});
  document.getElementById('media-editor').outerHTML=renderMediaEditorHTML();
};

function bindAdmin(){
  $('#new-product')?.addEventListener('click',()=>openProductForm());
  $$('[data-edit-prod]').forEach(b=>b.addEventListener('click',()=>openProductForm(b.dataset.editProd)));
  $$('[data-del-prod]').forEach(b=>b.addEventListener('click',()=>{
    if(confirm('Delete?')){db.products=db.products.filter(p=>p.id!==b.dataset.delProd);save();render();}
  }));
  $('#new-cat')?.addEventListener('click',()=>openCategoryForm());
  $$('[data-edit-cat]').forEach(b=>b.addEventListener('click',()=>openCategoryForm(b.dataset.editCat)));
  $$('[data-del-cat]').forEach(b=>b.addEventListener('click',()=>{
    if(confirm('Delete?')){db.categories=db.categories.filter(c=>c.id!==b.dataset.delCat);save();render();}
  }));
  $$('[data-view-order]').forEach(b=>b.addEventListener('click',()=>openOrderDetail(b.dataset.viewOrder)));
  $('#order-filter')?.addEventListener('change',e=>{
    const v=e.target.value;
    $$('#orders-table tbody tr').forEach(tr=>{tr.style.display=(v==='all'||tr.dataset.status===v)?'':'none';});
  });
  $$('[data-toggle-review]').forEach(b=>b.addEventListener('click',()=>{
    const r=db.reviews.find(x=>x.id===b.dataset.toggleReview);
    if(r){r.approved=r.approved===false;save();render();}
  }));
  $$('[data-del-review]').forEach(b=>b.addEventListener('click',()=>{
    if(confirm('Delete review?')){db.reviews=db.reviews.filter(x=>x.id!==b.dataset.delReview);save();render();}
  }));
  $('#settings-form')?.addEventListener('submit',e=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    ['brandName','tagline','announcement','heroImage','heroTitle','heroSubtitle','heroCta1Text','heroCta1Link','heroCta2Text','heroCta2Link','footerText','contactEmail','contactPhone','contactAddress','instagram','instagramUrl','currencySymbol'].forEach(k=>db.settings[k]=fd.get(k)||'');
    db.settings.shippingFee=+fd.get('shippingFee')||0;
    db.settings.codEnabled=fd.get('codEnabled')==='on';
    db.settings.upiEnabled=fd.get('upiEnabled')==='on';
    save();toast('Saved');render();
  });
  $('#reset-db')?.addEventListener('click',()=>{
    if(confirm('Reset ALL data? Cannot be undone.')){db=DB.reset();save();toast('Reset');location.hash='#admin2512/dashboard';render();}
  });
}

function openProductForm(id){
  const p=id?findProd(id):null;
  editingMedia=p?JSON.parse(JSON.stringify(p.media||[])):[{type:'image',url:''}];
  openModal(`<div class="admin-form"><h3 class="eyebrow mb-4">${p?'Edit':'New'} Product</h3>
    <form id="product-form">
      <div class="row"><label>Name<input name="name" value="${esc(p?.name||'')}" required/></label><label>Slug<input name="slug" value="${esc(p?.slug||'')}" required/></label></div>
      <div class="row"><label>Category<select name="categoryId" required>${db.categories.map(c=>`<option value="${c.id}" ${p?.categoryId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label>Status<select name="status"><option value="active" ${p?.status==='active'?'selected':''}>Active</option><option value="draft" ${p?.status==='draft'?'selected':''}>Draft</option></select></label></div>
      <div class="row"><label>Price<input name="price" type="number" value="${p?.price||0}" required/></label><label>MRP<input name="mrp" type="number" value="${p?.mrp||0}"/></label></div>
      <div class="row full" style="margin-bottom:14px"><div>${renderMediaEditorHTML()}</div></div>
      <div class="row full"><label>Description<textarea name="description">${esc(p?.description||'')}</textarea></label></div>
      <div class="row full"><label>Details<textarea name="details">${esc(p?.details||'')}</textarea></label></div>
      <div class="row full"><label>Care<textarea name="care">${esc(p?.care||'')}</textarea></label></div>
      <div class="row"><label>Sizes<input name="sizes" value="${esc((p?.sizes||['S','M','L','XL']).join(','))}"/></label><label>Stock (e.g. S:10,M:5)<input name="stock" value="${esc(Object.entries(p?.stock||{}).map(([k,v])=>k+':'+v).join(','))}"/></label></div>
      <div class="row"><label class="check"><input type="checkbox" name="featured" ${p?.featured?'checked':''}/> Featured</label><label class="check"><input type="checkbox" name="isNew" ${p?.isNew?'checked':''}/> New</label></div>
      <div class="admin-actions"><button type="submit" class="btn btn-gold">${p?'Save':'Create'}</button><button type="button" class="btn btn-outline" data-close>Cancel</button></div>
    </form>
  </div>`);
  $('#product-form').addEventListener('submit',e=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    const stockObj={};
    String(fd.get('stock')).split(',').forEach(s=>{const [k,v]=s.split(':');if(k)stockObj[k.trim()]=+v||0;});
    const validMedia=editingMedia.filter(m=>m.url);
    if(validMedia.length===0)return toast('Add at least one media item','error');
    const obj={
      id:p?.id||uid(),name:fd.get('name'),slug:fd.get('slug'),categoryId:fd.get('categoryId'),
      price:+fd.get('price')||0,mrp:+fd.get('mrp')||0,
      media:validMedia,
      description:fd.get('description'),details:fd.get('details'),care:fd.get('care'),
      sizes:String(fd.get('sizes')).split(',').map(s=>s.trim()).filter(Boolean),
      stock:stockObj,status:fd.get('status'),
      featured:fd.get('featured')==='on',isNew:fd.get('isNew')==='on',
      createdAt:p?.createdAt||Date.now()
    };
    if(p){const idx=db.products.findIndex(x=>x.id===p.id);db.products[idx]=obj;}
    else db.products.push(obj);
    save();closeModal();render();toast('Saved');
  });
  $$('[data-close]').forEach(el=>el.addEventListener('click',closeModal));
}

function openCategoryForm(id){
  const c=id?findCat(id):null;
  openModal(`<div class="admin-form"><h3 class="eyebrow mb-4">${c?'Edit':'New'} Category</h3>
    <form id="cat-form">
      <div class="row"><label>Name<input name="name" value="${esc(c?.name||'')}" required/></label><label>Label<input name="label" value="${esc(c?.label||'')}" required/></label></div>
      <div class="row"><label>Slug<input name="slug" value="${esc(c?.slug||'')}" required/></label><label>Order<input name="order" type="number" value="${c?.order||0}"/></label></div>
      <div class="row full"><label>Image<input name="image" value="${esc(c?.image||'')}"/></label></div>
      <div class="row full"><label>Description<textarea name="description">${esc(c?.description||'')}</textarea></label></div>
      <div class="admin-actions"><button type="submit" class="btn btn-gold">${c?'Save':'Create'}</button><button type="button" class="btn btn-outline" data-close>Cancel</button></div>
    </form>
  </div>`);
  $('#cat-form').addEventListener('submit',e=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    const obj={id:c?.id||uid(),name:fd.get('name'),label:fd.get('label'),slug:fd.get('slug'),order:+fd.get('order')||0,image:fd.get('image'),description:fd.get('description')};
    if(c){const idx=db.categories.findIndex(x=>x.id===c.id);db.categories[idx]=obj;}
    else db.categories.push(obj);
    save();closeModal();render();toast('Saved');
  });
  $$('[data-close]').forEach(el=>el.addEventListener('click',closeModal));
}

function openOrderDetail(id){
  const o=db.orders.find(x=>x.id===id);if(!o)return;
  const statuses=['pending','processing','shipped','delivered','cancelled'];
  openModal(`<div class="admin-form"><h3 class="eyebrow mb-4">Order ${esc(o.orderNo)}</h3>
    <div style="display:grid;gap:16px">
      <div><p class="gold-label">Customer</p><p style="font-size:13px">${esc(o.customer.name)}</p><p style="font-size:12px;color:var(--muted)">${esc(o.customer.email)} — ${esc(o.customer.phone)}</p></div>
      <div><p class="gold-label">Ship To</p><p style="font-size:13px">${esc(o.shipping_addr.address)}<br>${esc(o.shipping_addr.city)}, ${esc(o.shipping_addr.state)} ${esc(o.shipping_addr.pincode)}</p></div>
      <div><p class="gold-label">Items</p>${o.items.map(it=>`<div style="font-size:12px;padding:4px 0">${esc(it.name)} × ${it.qty} (${esc(it.size)}) — ${fmt(it.price*it.qty)}</div>`).join('')}</div>
      <div><p class="gold-label">Total</p><div class="order-row total"><span>${esc(o.payment)}</span><span>${fmt(o.total)}</span></div></div>
      <div><label style="font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)">Status<select id="order-status" style="width:100%;margin-top:6px;padding:8px;background:var(--bg);border:1px solid var(--line);color:var(--ivory)">${statuses.map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></label></div>
      <div class="admin-actions"><button class="btn btn-gold" id="save-status">Update</button><button class="btn btn-outline" data-close>Close</button></div>
    </div>
  </div>`);
  $('#save-status').addEventListener('click',()=>{o.status=$('#order-status').value;save();closeModal();render();toast('Updated');});
  $$('[data-close]').forEach(el=>el.addEventListener('click',closeModal));
}

function openModal(html){
  const m=document.createElement('div');
  m.className='modal open';m.id='modal';
  m.innerHTML=`<div class="modal-backdrop" data-close></div><div class="modal-panel" style="max-width:700px;margin:8vh auto;background:var(--bg2);border:1px solid var(--line);padding:24px;max-height:84vh;overflow-y:auto">${html}</div>`;
  document.body.appendChild(m);
  m.querySelectorAll('[data-close]').forEach(el=>el.addEventListener('click',closeModal));
}
function closeModal(){$('#modal')?.remove();}

/* ================================================================
   INIT
   ================================================================ */
window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
