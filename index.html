<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loading Catalog...</title>
    
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;500;600&display=swap');

        :root {
            --bg-base: #030303;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --accent-gold: #d4af37;
            --accent-gold-glow: rgba(212, 175, 55, 0.4);
            
            --glass-bg: rgba(20, 20, 20, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-blur: blur(30px);
            --glass-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Cinematic Backgrounds */
        .bg-layer {
            position: fixed; top: -5%; left: -5%; width: 110%; height: 110%;
            background-size: cover; background-position: center; z-index: -3; opacity: 0.3;
            animation: slowPan 40s infinite alternate ease-in-out;
        }

        .bg-noise {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)" opacity="0.05"/></svg>');
            z-index: -2; pointer-events: none;
        }

        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 0%, rgba(5, 5, 5, 0.4) 0%, rgba(5, 5, 5, 0.98) 80%);
            z-index: -1;
        }

        @keyframes slowPan {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.08) translate(-2%, -2%); }
        }

        .logo-font { font-family: 'Cinzel', serif; letter-spacing: 0.1em; text-transform: uppercase; }

        /* Navigation */
        nav {
            position: fixed; top: 0; left: 0; width: 100%; padding: 20px 40px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 100; background: rgba(5, 5, 5, 0.3); backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--glass-border);
        }

        .nav-logo { font-size: 1.6rem; color: var(--text-primary); font-weight: 900; }
        .nav-logo span { color: var(--accent-gold); text-shadow: 0 0 20px var(--accent-gold-glow); }
        
        .nav-links { display: flex; gap: 40px; }
        .nav-links a { 
            color: var(--text-secondary); text-decoration: none; font-size: 0.95rem; font-weight: 500; 
            transition: all 0.3s; position: relative; padding: 5px 0;
        }
        .nav-links a:hover { color: var(--text-primary); }
        .nav-links a::after {
            content: ''; position: absolute; bottom: 0; left: 50%; width: 0; height: 2px;
            background: var(--accent-gold); transition: all 0.3s; transform: translateX(-50%);
            opacity: 0;
        }
        .nav-links a:hover::after { width: 100%; opacity: 1; }

        /* Animations */
        .reveal { opacity: 0; transform: translateY(30px); transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .reveal.visible { opacity: 1; transform: translateY(0); }
        .delay-1 { transition-delay: 0.1s; }
        .delay-2 { transition-delay: 0.2s; }

        /* Hero Section */
        .hero {
            min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 0 20px; position: relative; z-index: 10;
        }

        .glass-orb {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 600px; height: 600px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.08), rgba(0,0,0,0) 60%);
            box-shadow: inset 0 0 80px rgba(212, 175, 55, 0.05), 0 0 100px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.03); z-index: -1;
            animation: floatOrb 8s infinite alternate ease-in-out;
        }

        @keyframes floatOrb {
            0% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
            100% { transform: translate(-50%, -52%) rotate(5deg) scale(1.02); }
        }

        .hero-title { 
            font-size: 6.5rem; font-weight: 900; line-height: 1.1; margin-bottom: 20px; 
            background: linear-gradient(180deg, #ffffff 0%, #a1a1aa 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .hero-title span { 
            background: linear-gradient(180deg, #ffe28a 0%, #d4af37 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px var(--accent-gold-glow));
        }

        .hero-desc { font-size: 1.2rem; color: var(--text-secondary); max-width: 650px; line-height: 1.8; margin-bottom: 50px; }

        .btn-primary {
            background: linear-gradient(180deg, #ffffff 0%, #e0e0e0 100%); color: #000;
            padding: 18px 50px; border-radius: 12px; font-weight: 700; font-size: 1.05rem;
            text-decoration: none; border: none; cursor: pointer; transition: all 0.4s;
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.1); text-transform: uppercase;
        }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 20px 40px rgba(255, 255, 255, 0.2); }

        /* Catalog Section */
        .catalog { padding: 100px 5% 150px; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 10; }
        .section-title { font-size: 2.5rem; margin-bottom: 60px; text-align: center; font-weight: 700; }
        .section-title::after { content: ''; display: block; width: 100px; height: 2px; background: linear-gradient(90deg, transparent, var(--accent-gold), transparent); margin: 15px auto 0; }

        /* 3D Glass Cards */
        .chapter-list { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 25px; perspective: 1200px; }
        
        .chapter-card {
            width: 100%; background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border); border-radius: 24px; padding: 40px 50px;
            box-shadow: var(--glass-shadow); display: flex; justify-content: space-between; align-items: center; 
            cursor: pointer; position: relative; overflow: hidden;
            transform-style: preserve-3d; will-change: transform;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* Dynamic Light Sheen */
        .card-sheen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; transition: opacity 0.3s ease; pointer-events: none; z-index: 1;
            transform: translateZ(1px);
        }

        .chapter-card:hover { border-color: rgba(255, 255, 255, 0.2); box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.2); }
        .chapter-card:hover .card-sheen { opacity: 1; }

        /* Note: pointer-events: none on children prevents mouse flickering */
        .chapter-info { display: flex; flex-direction: column; gap: 8px; transform: translateZ(30px); pointer-events: none; }
        .chapter-num { font-size: 0.85rem; color: var(--accent-gold); letter-spacing: 4px; text-transform: uppercase; font-weight: 700; }
        .chapter-name { font-size: 2rem; font-weight: 600; color: var(--text-primary); }

        .btn-read {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--text-primary);
            padding: 14px 35px; border-radius: 30px; font-weight: 600; font-size: 0.95rem; 
            transition: all 0.3s; pointer-events: none; transform: translateZ(20px);
        }
        .chapter-card:hover .btn-read { background: var(--text-primary); color: var(--bg-base); }

        /* --------------------------------
           FIXED PREMIUM VIEWER
        ----------------------------------- */
        #viewer {
            display: flex; opacity: 0; visibility: hidden;
            position: fixed; top: 0; left: 0; width: 100%; height: 100dvh; /* 100dvh fixes mobile address bar issues */
            background: #020202; z-index: 9999; flex-direction: column;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        
        #viewer.open { opacity: 1; visibility: visible; }

        .viewer-toolbar {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            width: 95%; max-width: 1000px; display: flex; justify-content: space-between; align-items: center;
            padding: 12px 24px; background: rgba(15, 15, 15, 0.85); backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border); border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 20;
        }

        .viewer-title { font-size: 0.9rem; font-weight: 500; color: var(--text-secondary); }
        .toolbar-controls { display: flex; align-items: center; gap: 15px; }
        
        .btn-icon {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary); width: 36px; height: 36px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s;
        }
        .btn-icon:hover { background: rgba(255, 255, 255, 0.15); }
        .btn-close { color: #ff6b6b; border-color: rgba(255, 50, 50, 0.3); }

        .page-indicator { font-size: 0.9rem; font-weight: 500; color: var(--text-secondary); min-width: 60px; text-align: center; }

        .viewer-stage {
            flex: 1; position: relative; display: flex; justify-content: center; align-items: center;
            overflow: hidden; padding: 80px 20px 80px; /* Space for top and bottom bars */
            min-height: 0; /* Crucial for flexbox to prevent overflow */
        }

        /* The Canvas fits perfectly inside the stage without overflowing */
        #canvas-element {
            max-width: 100%; max-height: 100%; object-fit: contain;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9); border-radius: 4px;
            transition: opacity 0.2s ease; opacity: 0;
        }

        .click-zone { position: absolute; top: 0; bottom: 0; width: 25%; cursor: pointer; z-index: 5; }
        .zone-left { left: 0; }
        .zone-right { right: 0; }

        .side-arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(15, 15, 15, 0.6); backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border); color: var(--text-secondary);
            width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 1.5rem; cursor: pointer; z-index: 10; transition: 0.2s;
        }
        .side-arrow:hover { background: rgba(255, 255, 255, 0.15); color: var(--text-primary); }
        #arrow-prev { left: 30px; }
        #arrow-next { right: 30px; }

        .mobile-nav {
            display: none; position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; padding: 12px 20px; background: rgba(15, 15, 15, 0.95);
            backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-border);
            border-radius: 30px; z-index: 20; justify-content: space-between; align-items: center;
        }

        .mobile-nav .btn-icon { width: 44px; height: 44px; font-size: 1.2rem; }

        .settings-menu {
            position: absolute; top: 80px; right: 5%; width: 300px;
            background: rgba(10, 10, 10, 0.95); backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border); border-radius: 16px; padding: 24px;
            z-index: 30; display: none; flex-direction: column; gap: 20px;
        }
        .settings-menu.active { display: flex; animation: fadeInDown 0.3s ease; }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        .setting-group { display: flex; flex-direction: column; gap: 10px; }
        .setting-label { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; }
        
        .options-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .opt-btn {
            flex: 1; min-width: calc(33% - 8px); background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-primary); padding: 10px 5px; border-radius: 8px; cursor: pointer;
            font-size: 0.85rem; transition: all 0.2s; text-align: center;
        }
        .opt-btn.active, .opt-btn:hover { background: var(--text-primary); color: var(--bg-base); font-weight: 600; }

        .spinner {
            position: absolute; width: 40px; height: 40px;
            border: 2px solid rgba(255, 255, 255, 0.1); border-top-color: var(--accent-gold);
            border-radius: 50%; animation: spin 1s linear infinite; z-index: 5;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Responsive */
        @media (max-width: 768px) {
            .bg-layer { background-image: var(--mobile-bg); }
            nav { padding: 15px 20px; }
            .nav-links { display: none; }
            .hero-title { font-size: 3.5rem; }
            .glass-orb { width: 300px; height: 300px; }
            
            .chapter-card { flex-direction: column; text-align: center; gap: 20px; padding: 30px 20px; }
            .chapter-name { font-size: 1.6rem; }
            .chapter-card-container { transform: none !important; } /* Disable 3D on mobile */
            
            .viewer-toolbar { width: 95%; top: 10px; padding: 10px 15px; border-radius: 20px; }
            .viewer-title, #page-ui { display: none; } 
            
            .viewer-stage { padding: 70px 10px 90px; } 
            .side-arrow { display: none; } 
            .mobile-nav { display: flex; } 
            
            .settings-menu { right: 50%; transform: translateX(50%); width: 95%; top: 60px; }
        }
    </style>
</head>
<body>

    <div class="bg-layer" id="bg-layer"></div>
    <div class="bg-noise"></div>
    <div class="bg-overlay"></div>

    <nav>
        <div class="nav-logo logo-font" id="nav-title">Loading...</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#catalog">Catalog</a>
        </div>
    </nav>

    <section class="hero">
        <div class="glass-orb"></div>
        <h1 class="hero-title logo-font reveal" id="hero-title">...</h1>
        <p class="hero-desc reveal delay-1" id="hero-desc">...</p>
        <a href="#catalog" class="btn-primary reveal delay-2">Explore Chapters</a>
    </section>

    <section class="catalog" id="catalog">
        <h2 class="section-title logo-font reveal">Chapters</h2>
        <div class="chapter-list reveal delay-1" id="chapter-list">
            <!-- Cards Generated by JS -->
        </div>
    </section>

    <!-- Viewer Modal -->
    <div id="viewer">
        <div class="viewer-toolbar">
            <div class="viewer-title logo-font" id="viewer-title-text">...</div>
            <div class="toolbar-controls">
                <span class="page-indicator" id="page-ui">1 / 1</span>
                <button class="btn-icon" id="btn-settings" title="Settings">⚙</button>
                <button class="btn-icon btn-close" onclick="closeViewer()" title="Close (Esc)">✕</button>
            </div>
        </div>

        <div class="settings-menu" id="settings-menu">
            <div class="setting-group">
                <div class="setting-label">Reading Direction</div>
                <div class="options-row">
                    <button class="opt-btn dir-btn" data-dir="ltr" onclick="setDirection('ltr')">Left to Right</button>
                    <button class="opt-btn dir-btn" data-dir="rtl" onclick="setDirection('rtl')">Right to Left</button>
                </div>
            </div>
            <div class="setting-group">
                <div class="setting-label">Image Quality</div>
                <div class="options-row">
                    <button class="opt-btn zoom-btn" data-scale="1.0" onclick="setQuality(1.0)">Standard</button>
                    <button class="opt-btn zoom-btn" data-scale="1.5" onclick="setQuality(1.5)">High</button>
                    <button class="opt-btn zoom-btn" data-scale="2.0" onclick="setQuality(2.0)">Ultra</button>
                </div>
            </div>
            <div class="setting-group">
                <div class="setting-label">Preload Pages</div>
                <div class="options-row">
                    <button class="opt-btn preload-btn" data-preload="0" onclick="setPreload(0)">0</button>
                    <button class="opt-btn preload-btn" data-preload="2" onclick="setPreload(2)">2</button>
                    <button class="opt-btn preload-btn" data-preload="4" onclick="setPreload(4)">4</button>
                    <button class="opt-btn preload-btn" data-preload="6" onclick="setPreload(6)">6</button>
                    <button class="opt-btn preload-btn" data-preload="unlimited" onclick="setPreload('unlimited')">∞</button>
                </div>
            </div>
        </div>

        <div class="viewer-stage">
            <div class="spinner" id="spinner"></div>
            <div class="click-zone zone-left" onclick="handleZoneClick('prev')"></div>
            <div class="click-zone zone-right" onclick="handleZoneClick('next')"></div>
            <button class="side-arrow" id="arrow-prev" onclick="handleZoneClick('prev')">❮</button>
            <button class="side-arrow" id="arrow-next" onclick="handleZoneClick('next')">❯</button>
            
            <!-- Canvas -->
            <canvas id="canvas-element"></canvas>
        </div>

        <div class="mobile-nav">
            <button class="btn-icon" onclick="handleZoneClick('prev')">❮</button>
            <span class="page-indicator" id="mobile-page-ui" style="display:block; color: #fff;">1 / 1</span>
            <button class="btn-icon" onclick="handleZoneClick('next')">❯</button>
        </div>
    </div>

    <!-- App Logic -->
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // --- 1. GLOBAL STATE ---
        let configData = null;
        let pdfDoc = null;
        let currentPage = 1;
        let totalPages = 0;
        let currentScale = 1.5;
        let direction = 'ltr'; 
        let isRendering = false;
        let preloadCount = 5;
        const preloadedCache = new Map();
        let isMobile = window.matchMedia("(max-width: 768px)").matches;

        // --- 2. INITIALIZATION ---
        document.addEventListener("DOMContentLoaded", async () => {
            setupScrollAnimations();
            
            try {
                const response = await fetch('config.json');
                if (!response.ok) throw new Error("Config not found");
                configData = await response.json();
                applyConfig(configData);
            } catch (error) {
                console.error("Error loading config.json:", error);
                document.getElementById('nav-title').innerHTML = "SOULSTAKER";
                document.getElementById('hero-title').innerHTML = "SOULSTAKER";
            }
        });

        function applyConfig(config) {
            document.title = `${config.site.title} | Catalog`;
            document.getElementById('nav-title').innerHTML = config.site.title.replace('O', '<span>O</span>');
            document.getElementById('hero-title').innerHTML = config.site.title.replace('O', '<span>O</span>');
            document.getElementById('hero-desc').textContent = config.site.heroDesc;

            const bgLayer = document.getElementById('bg-layer');
            bgLayer.style.backgroundImage = `url('${config.assets.bgDesktop}')`;
            document.documentElement.style.setProperty('--mobile-bg', `url('${config.assets.bgMobile}')`);

            setDirection(config.defaults.direction);
            setQuality(config.defaults.quality, true);
            setPreload(config.defaults.preload, true);

            const listContainer = document.getElementById('chapter-list');
            listContainer.innerHTML = ''; 

            config.chapters.forEach((ch, index) => {
                const card = document.createElement('div');
                card.className = `chapter-card reveal delay-${(index % 3) + 1}`;
                card.onclick = () => openViewer(ch.file, `Chapter ${ch.id}: ${ch.title}`);
                
                card.innerHTML = `
                    <div class="card-sheen"></div>
                    <div class="chapter-info">
                        <div class="chapter-num">Chapter ${String(ch.id).padStart(2, '0')}</div>
                        <div class="chapter-name">${ch.title}</div>
                    </div>
                    <button class="btn-read">Read Now</button>
                `;

                // Only attach 3D tilt on desktop
                if (!isMobile) {
                    card.addEventListener('mousemove', handle3DTilt);
                    card.addEventListener('mouseleave', reset3DTilt);
                }

                listContainer.appendChild(card);
            });

            setupScrollAnimations();
        }

        // --- 3. SMOOTH 3D MOUSE TRACKING LOGIC ---
        function handle3DTilt(e) {
            const card = e.currentTarget;
            const sheen = card.querySelector('.card-sheen');
            const rect = card.getBoundingClientRect();
            
            // Calculate relative position (-0.5 to 0.5)
            const x = (e.clientX - rect.left) / rect.width - 0.5;
            const y = (e.clientY - rect.top) / rect.height - 0.5;

            // Reduced tilt angle for smoothness
            const rotateX = y * -8; 
            const rotateY = x * 8;  

            card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
            
            // Move sheen
            sheen.style.background = `radial-gradient(circle at ${(x + 0.5) * 100}% ${(y + 0.5) * 100}%, rgba(255,255,255,0.15) 0%, transparent 60%)`;
        }

        function reset3DTilt(e) {
            const card = e.currentTarget;
            const sheen = card.querySelector('.card-sheen');
            
            card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)`;
            sheen.style.background = `radial-gradient(circle at 50% 50%, rgba(255,255,255,0.1) 0%, transparent 60%)`;
        }

        // --- 4. UI ANIMATIONS ---
        function setupScrollAnimations() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        }

        // --- 5. VIEWER CORE ---
        const viewer = document.getElementById('viewer');
        const canvas = document.getElementById('canvas-element');
        const ctx = canvas.getContext('2d');
        const spinner = document.getElementById('spinner');
        const pageUI = document.getElementById('page-ui');
        const mobilePageUI = document.getElementById('mobile-page-ui');
        const settingsMenu = document.getElementById('settings-menu');
        const arrowPrev = document.getElementById('arrow-prev');
        const arrowNext = document.getElementById('arrow-next');

        document.getElementById('btn-settings').addEventListener('click', (e) => {
            e.stopPropagation();
            settingsMenu.classList.toggle('active');
        });

        document.addEventListener('click', (e) => {
            if (!settingsMenu.contains(e.target) && e.target.id !== 'btn-settings') {
                settingsMenu.classList.remove('active');
            }
        });

        async function openViewer(pdfUrl, title) {
            viewer.classList.add('open');
            document.body.style.overflow = 'hidden';
            settingsMenu.classList.remove('active');
            document.getElementById('viewer-title-text').textContent = title;
            
            if (pdfDoc) pdfDoc.destroy();
            preloadedCache.clear();
            currentPage = 1;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            canvas.style.opacity = '0';

            spinner.style.display = 'block';
            try {
                pdfDoc = await pdfjsLib.getDocument(pdfUrl).promise;
                totalPages = pdfDoc.numPages;
                updateUI();
                renderPage(currentPage);
            } catch (err) {
                console.error("PDF Load Error:", err);
                alert(`Could not load ${pdfUrl}. Check file path.`);
                closeViewer();
            }
        }

        function closeViewer() {
            viewer.classList.remove('open');
            document.body.style.overflow = 'auto';
            settingsMenu.classList.remove('active');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            preloadedCache.clear(); 
        }

        function setDirection(dir) {
            direction = dir;
            document.querySelectorAll('.dir-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.dir === dir));
            updateUI();
        }

        function setQuality(scale, silent = false) {
            currentScale = scale;
            document.querySelectorAll('.zoom-btn').forEach(btn => btn.classList.toggle('active', parseFloat(btn.dataset.scale) === scale));
            if(!silent && pdfDoc) {
                preloadedCache.clear();
                renderPage(currentPage);
            }
        }

        function setPreload(val, silent = false) {
            preloadCount = val;
            document.querySelectorAll('.preload-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.preload == val));
            if(!silent && pdfDoc) startPreload();
        }

        function handleZoneClick(directionClicked) {
            if (isRendering || !pdfDoc) return;
            let step = (directionClicked === 'next') ? 1 : -1;
            if (direction === 'rtl') step *= -1;
            let newPage = currentPage + step;
            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                updateUI();
                renderPage(currentPage);
            }
        }

        function updateUI() {
            const text = `${currentPage} / ${totalPages}`;
            pageUI.textContent = text;
            mobilePageUI.textContent = text;

            if (direction === 'ltr') {
                arrowPrev.innerHTML = '❮'; arrowNext.innerHTML = '❯';
                arrowPrev.style.opacity = currentPage <= 1 ? '0.3' : '1';
                arrowNext.style.opacity = currentPage >= totalPages ? '0.3' : '1';
            } else {
                arrowPrev.innerHTML = '❯'; arrowNext.innerHTML = '❮';
                arrowPrev.style.opacity = currentPage >= totalPages ? '0.3' : '1';
                arrowNext.style.opacity = currentPage <= 1 ? '0.3' : '1';
            }
        }

        async function renderPage(num) {
            if (!pdfDoc) return;
            isRendering = true;
            spinner.style.display = 'block';
            canvas.style.opacity = '0.5';

            for (let [key, val] of preloadedCache.entries()) {
                if (key !== 'loading' && Math.abs(key - num) > 8) preloadedCache.delete(key);
            }

            try {
                if (preloadedCache.has(num) && preloadedCache.get(num) !== 'loading') {
                    const cachedCanvas = preloadedCache.get(num);
                    canvas.width = cachedCanvas.width;
                    canvas.height = cachedCanvas.height;
                    // CSS handles the display size
                    ctx.drawImage(cachedCanvas, 0, 0);
                } else {
                    const page = await pdfDoc.getPage(num);
                    const viewport = page.getViewport({ scale: currentScale });
                    
                    const outputScale = window.devicePixelRatio || 1;
                    canvas.width = Math.floor(viewport.width * outputScale);
                    canvas.height = Math.floor(viewport.height * outputScale);
                    
                    // IMPORTANT: Do not set canvas.style.width/height here.
                    // Let the CSS max-width/max-height + object-fit handle the display size.
                    
                    const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

                    await page.render({
                        canvasContext: ctx,
                        transform: transform,
                        viewport: viewport
                    }).promise;
                }
                
                canvas.style.opacity = '1';
                spinner.style.display = 'none';
                isRendering = false;
                startPreload();

            } catch (err) {
                console.error("Render Error:", err);
                isRendering = false;
            }
        }

        let preloadTimeout = null;
        function startPreload() {
            if (preloadCount === 0) return;
            clearTimeout(preloadTimeout);
            
            let pagesToLoad = preloadCount === 'unlimited' ? (totalPages - currentPage) : parseInt(preloadCount);
            let pageToLoad = currentPage + 1;
            let loadedCount = 0;

            const loadNextInQueue = () => {
                if (loadedCount >= pagesToLoad || pageToLoad > totalPages) return;
                
                if (preloadedCache.has(pageToLoad)) {
                    pageToLoad++; loadedCount++; loadNextInQueue();
                } else {
                    preloadPage(pageToLoad).then(() => {
                        pageToLoad++; loadedCount++;
                        preloadTimeout = setTimeout(loadNextInQueue, 100);
                    });
                }
            };
            loadNextInQueue();
        }

        async function preloadPage(num) {
            if (!pdfDoc || preloadedCache.has(num)) return;
            preloadedCache.set(num, 'loading'); 
            
            try {
                const page = await pdfDoc.getPage(num);
                const viewport = page.getViewport({ scale: currentScale });
                
                const offCanvas = document.createElement('canvas');
                const outputScale = window.devicePixelRatio || 1;
                
                offCanvas.width = Math.floor(viewport.width * outputScale);
                offCanvas.height = Math.floor(viewport.height * outputScale);

                const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

                await page.render({
                    canvasContext: offCanvas.getContext('2d'),
                    transform: transform,
                    viewport: viewport
                }).promise;

                preloadedCache.set(num, offCanvas);
            } catch (e) {
                preloadedCache.delete(num); 
            }
        }

        document.addEventListener('keydown', (e) => {
            if (viewer.classList.contains('open')) {
                if (e.key === 'Escape') closeViewer();
                if (e.key === 'ArrowRight') handleZoneClick('next');
                if (e.key === 'ArrowLeft') handleZoneClick('prev');
            }
        });
    </script>
</body>
</html>
