<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOULSTAKER | Manga Catalog</title>
    
    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@300;400;600&display=swap');

        :root {
            --bg-color: #030303;
            --text-main: #e0e0e0;
            --text-muted: #888888;
            --accent-gold: #e6b800;
            --accent-gold-glow: rgba(230, 184, 0, 0.4);
            --glass-bg: rgba(15, 15, 15, 0.75);
            --glass-border: rgba(230, 184, 0, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(230, 184, 0, 0.05) 0%, transparent 60%),
                url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)" opacity="0.03"/></svg>');
            background-attachment: fixed;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .logo-font {
            font-family: 'Cinzel', serif;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(3,3,3,0.95) 0%, rgba(3,3,3,0) 100%);
            backdrop-filter: blur(10px);
            pointer-events: none; /* Let clicks pass through to the reader */
        }

        .logo-container {
            pointer-events: auto;
        }

        .logo-text {
            font-size: 2.2rem;
            color: #fff;
            position: relative;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .logo-text span {
            color: var(--accent-gold);
            font-weight: 800;
            text-shadow: 0 0 15px var(--accent-gold-glow);
        }

        .subtitle {
            font-size: 0.65rem;
            color: var(--text-muted);
            letter-spacing: 7px;
            text-transform: uppercase;
            margin-top: 5px;
            text-align: center;
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 100px 20px;
            position: relative;
        }

        .hero-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('cover.jpg'); /* Cover Image */
            background-size: cover;
            background-position: center;
            opacity: 0.2;
            z-index: -1;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
        }

        .hero-title {
            font-size: 6rem;
            margin-bottom: 20px;
            color: #fff;
            text-shadow: 0 0 40px rgba(230, 184, 0, 0.3);
            animation: breathe 4s infinite alternate;
        }

        @keyframes breathe {
            0% { text-shadow: 0 0 20px rgba(230, 184, 0, 0.2); transform: scale(1); }
            100% { text-shadow: 0 0 50px rgba(230, 184, 0, 0.5); transform: scale(1.02); }
        }

        .hero-desc {
            max-width: 600px;
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 40px;
        }

        /* Catalog Section */
        .catalog-section {
            padding: 50px 10% 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .section-title {
            font-size: 2rem;
            margin-bottom: 50px;
            color: #fff;
            text-align: center;
            position: relative;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
        }

        /* Premium Chapter Card */
        .chapter-card {
            width: 100%;
            max-width: 800px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 40px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .chapter-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(230, 184, 0, 0.08), transparent);
            transform: skewX(-25deg);
            transition: left 0.7s ease;
        }

        .chapter-card:hover {
            transform: translateY(-5px);
            border-color: rgba(230, 184, 0, 0.5);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 0 0 30px rgba(230, 184, 0, 0.15);
        }

        .chapter-card:hover::before {
            left: 200%;
        }

        .chapter-info {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chapter-num {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            color: var(--accent-gold);
            letter-spacing: 2px;
        }

        .chapter-name {
            font-size: 2rem;
            color: #fff;
            font-weight: 600;
        }

        .btn-read {
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 15px 40px;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(230, 184, 0, 0.1);
        }

        .chapter-card:hover .btn-read {
            background: var(--accent-gold);
            color: #000;
            box-shadow: 0 0 25px rgba(230, 184, 0, 0.6);
        }

        /* --------------------------------
           MULTI-PAGE CONTINUOUS VIEWER
        ----------------------------------- */
        #viewer-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #050505;
            z-index: 2000;
            flex-direction: column;
        }

        /* Floating Top Bar */
        .viewer-toolbar {
            position: absolute;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            width: 95%; max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            backdrop-filter: blur(15px);
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: opacity 0.3s;
        }

        .viewer-title {
            font-size: 1rem;
            color: var(--accent-gold);
            font-family: 'Cinzel', serif;
            letter-spacing: 2px;
            margin-left: 10px;
        }

        .toolbar-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            width: 36px; height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .control-btn:hover {
            background: var(--accent-gold);
            color: #000;
            border-color: var(--accent-gold);
        }

        .control-btn.close-btn {
            width: auto;
            border-radius: 20px;
            padding: 0 15px;
            background: rgba(255, 50, 50, 0.1);
            border-color: rgba(255, 50, 50, 0.3);
            color: #ff6b6b;
        }

        .control-btn.close-btn:hover {
            background: #ff4d4d;
            color: #fff;
            border-color: #ff4d4d;
        }

        .page-indicator {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
            min-width: 60px;
            text-align: center;
        }

        /* Scrollable Canvas Area */
        .scroll-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 100px 20px 50px;
            scroll-behavior: smooth;
        }

        /* Page Wrapper */
        .page-wrapper {
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            background: #111; /* Placeholder color while loading */
            border-radius: 4px;
            position: relative;
            /* Dynamic aspect ratio prevents layout shifts */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
        }

        .page-wrapper canvas {
            display: block;
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .page-wrapper.loaded canvas {
            opacity: 1;
        }

        .page-wrapper.loaded {
            background: transparent;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
        }

        .page-loader {
            position: absolute;
            width: 30px; height: 30px;
            border: 2px solid rgba(230, 184, 0, 0.1);
            border-top-color: var(--accent-gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Settings Panel */
        .settings-panel {
            position: absolute;
            top: 80px; right: 5%;
            background: rgba(15, 15, 15, 0.95);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(20px);
            z-index: 20;
            display: none;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            width: 250px;
        }

        .settings-panel.active {
            display: flex;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setting-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .quality-options {
            display: flex;
            gap: 10px;
        }

        .quality-btn {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .quality-btn.active, .quality-btn:hover {
            background: var(--accent-gold);
            color: #000;
            border-color: var(--accent-gold);
            font-weight: bold;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero-title { font-size: 3rem; }
            .chapter-card { flex-direction: column; text-align: center; gap: 30px; padding: 30px; }
            .chapter-info { align-items: center; }
            .viewer-title { display: none; }
            .toolbar-controls { width: 100%; justify-content: space-between; }
            .settings-panel { right: 50%; transform: translateX(50%); top: 70px; width: 90%; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo-container">
            <div class="logo-text logo-font">S<span>O</span>ULSTAKER</div>
            <div class="subtitle">A Comic by Aarav Jha</div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-bg"></div>
        <h1 class="hero-title logo-font">S<span style="color: var(--accent-gold);">O</span>ULSTAKER</h1>
        <p class="hero-desc">In a world shattered by cosmic forces, one soul must traverse the ruins to uncover the truth. Experience the dark fantasy epic.</p>
    </section>

    <!-- Catalog Section -->
    <section class="catalog-section">
        <h2 class="section-title logo-font">Chapters</h2>
        
        <div class="chapter-card" onclick="openViewer('chapter1.pdf', 'Chapter 1: The First Glimpse')">
            <div class="chapter-info">
                <div class="chapter-num">CHAPTER 01</div>
                <div class="chapter-name">The First Glimpse</div>
            </div>
            <button class="btn-read">Read Now</button>
        </div>
    </section>

    <!-- Multi-Page Continuous Viewer Overlay -->
    <div id="viewer-overlay">
        
        <!-- Top Toolbar -->
        <div class="viewer-toolbar" id="toolbar">
            <div class="viewer-title" id="viewer-title-text">Loading...</div>
            
            <div class="toolbar-controls">
                <span class="page-indicator" id="current-page-indicator">0 / 0</span>
                <button class="control-btn" id="settings-btn" title="Settings">⚙</button>
                <button class="control-btn close-btn" onclick="closeViewer()" title="Close">Close</button>
            </div>
        </div>

        <!-- Settings Panel -->
        <div class="settings-panel" id="settings-panel">
            <div class="setting-group">
                <label>Render Quality</label>
                <div class="quality-options">
                    <button class="quality-btn" data-scale="1.0" onclick="changeQuality(1.0, this)">Low</button>
                    <button class="quality-btn active" data-scale="1.5" onclick="changeQuality(1.5, this)">Med</button>
                    <button class="quality-btn" data-scale="2.0" onclick="changeQuality(2.0, this)">High</button>
                </div>
                <span style="font-size: 0.7rem; color: #666; margin-top: 5px;">Higher quality uses more memory.</span>
            </div>
        </div>

        <!-- Scroll Container for Pages -->
        <div class="scroll-container" id="scroll-container">
            <!-- Pages will be injected here via JS -->
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        // Set PDF.js worker path
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let pdfDoc = null;
        let currentScale = 1.5; // Default Quality
        const scrollContainer = document.getElementById('scroll-container');
        const viewerOverlay = document.getElementById('viewer-overlay');
        const pageIndicator = document.getElementById('current-page-indicator');
        const settingsPanel = document.getElementById('settings-panel');
        let observer = null;

        // Toggle Settings Panel
        document.getElementById('settings-btn').addEventListener('click', () => {
            settingsPanel.classList.toggle('active');
        });

        // Open Viewer & Initialize Multi-page setup
        async function openViewer(pdfUrl, title) {
            viewerOverlay.style.display = 'flex';
            document.getElementById('viewer-title-text').textContent = title;
            document.body.style.overflow = 'hidden';
            scrollContainer.innerHTML = ''; // Clear previous
            
            try {
                pdfDoc = await pdfjsLib.getDocument(pdfUrl).promise;
                buildPagePlaceholders(pdfDoc.numPages);
                setupIntersectionObserver();
            } catch (error) {
                alert("Error loading PDF. Are you running this on a local server?");
                console.error(error);
            }
        }

        // Close Viewer
        function closeViewer() {
            viewerOverlay.style.display = 'none';
            document.body.style.overflow = 'auto';
            scrollContainer.innerHTML = ''; // Destroy pages to free memory
            pdfDoc = null;
            if (observer) observer.disconnect();
        }

        // Create empty wrappers for all pages to enable scrolling
        function buildPagePlaceholders(numPages) {
            for (let i = 1; i <= numPages; i++) {
                const wrapper = document.createElement('div');
                wrapper.className = 'page-wrapper';
                wrapper.id = `page-wrapper-${i}`;
                wrapper.dataset.pageNum = i;
                
                // Add loading spinner
                const loader = document.createElement('div');
                loader.className = 'page-loader';
                wrapper.appendChild(loader);
                
                scrollContainer.appendChild(wrapper);
            }
            pageIndicator.textContent = `1 / ${numPages}`;
        }

        // Intersection Observer: Loads pages only when they enter the view
        function setupIntersectionObserver() {
            const options = {
                root: scrollContainer,
                rootMargin: '100% 0px', // Pre-load pages 1 screen height before they are seen
                threshold: 0.01
            };

            observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const pageNum = parseInt(entry.target.dataset.pageNum);
                        renderPage(pageNum);
                        
                        // Update UI Indicator
                        pageIndicator.textContent = `${pageNum} / ${pdfDoc.numPages}`;
                        
                        // Pre-load next 2 pages explicitly
                        if (pageNum + 1 <= pdfDoc.numPages) renderPage(pageNum + 1);
                        if (pageNum + 2 <= pdfDoc.numPages) renderPage(pageNum + 2);
                    }
                });
            }, options);

            // Observe all placeholders
            document.querySelectorAll('.page-wrapper').forEach(wrapper => {
                observer.observe(wrapper);
            });
        }

        // Render a specific page
        async function renderPage(num) {
            const wrapper = document.getElementById(`page-wrapper-${num}`);
            
            // If already rendered at correct scale, skip
            if (wrapper.dataset.rendered === 'true' && wrapper.dataset.scale === currentScale.toString()) return;
            
            // Mark as rendering to prevent duplicate calls
            wrapper.dataset.rendered = 'rendering';
            
            try {
                const page = await pdfDoc.getPage(num);
                const viewport = page.getViewport({ scale: currentScale });
                
                // Create or reuse canvas
                let canvas = wrapper.querySelector('canvas');
                if (!canvas) {
                    canvas = document.createElement('canvas');
                    wrapper.appendChild(canvas);
                }
                
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                
                const renderContext = {
                    canvasContext: canvas.getContext('2d'),
                    viewport: viewport
                };

                await page.render(renderContext).promise;
                
                // Cleanup loader and mark as complete
                const loader = wrapper.querySelector('.page-loader');
                if (loader) loader.remove();
                
                wrapper.classList.add('loaded');
                wrapper.dataset.rendered = 'true';
                wrapper.dataset.scale = currentScale;

                // Memory Optimization: Clear canvases for pages far away
                cleanupMemory(num);

            } catch (err) {
                console.log("Render error on page", num, err);
            }
        }

        // Unload memory of pages too far from current view to prevent mobile crashes
        function cleanupMemory(currentPage) {
            document.querySelectorAll('.page-wrapper').forEach(wrapper => {
                const num = parseInt(wrapper.dataset.pageNum);
                // If page is more than 5 pages away from current page, clear its canvas memory
                if (Math.abs(num - currentPage) > 5 && wrapper.dataset.rendered === 'true') {
                    const canvas = wrapper.querySelector('canvas');
                    if (canvas) {
                        canvas.width = 0; 
                        canvas.height = 0;
                    }
                    wrapper.classList.remove('loaded');
                    wrapper.dataset.rendered = 'false';
                    
                    // Re-add loader if it's missing
                    if (!wrapper.querySelector('.page-loader')) {
                        const loader = document.createElement('div');
                        loader.className = 'page-loader';
                        wrapper.appendChild(loader);
                    }
                }
            });
        }

        // Handle Quality Changes
        function changeQuality(newScale, btnElement) {
            if (currentScale === newScale) return;
            currentScale = newScale;
            
            // Update UI
            document.querySelectorAll('.quality-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            
            // Re-render current visible pages
            const currentPage = parseInt(pageIndicator.textContent.split(' ')[0]);
            
            // Reset all pages so they re-render at the new scale
            document.querySelectorAll('.page-wrapper').forEach(wrapper => {
                wrapper.dataset.rendered = 'false';
                wrapper.classList.remove('loaded');
                const canvas = wrapper.querySelector('canvas');
                if(canvas) { canvas.width = 0; canvas.height = 0; }
                
                if (!wrapper.querySelector('.page-loader')) {
                    const loader = document.createElement('div');
                    loader.className = 'page-loader';
                    wrapper.appendChild(loader);
                }
            });

            // Force render the current page and pre-load neighbors
            renderPage(currentPage);
            if (currentPage + 1 <= pdfDoc.numPages) renderPage(currentPage + 1);
            if (currentPage - 1 > 0) renderPage(currentPage - 1);
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (viewerOverlay.style.display === 'flex') {
                if (e.key === 'Escape') closeViewer();
            }
        });
    </script>
</body>
</html>
