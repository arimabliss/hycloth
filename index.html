<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>Callote — Premium Store</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230a0a0f'/%3E%3Ctext x='50' y='72' font-size='58' font-family='sans-serif' font-weight='800' fill='%23e11d74' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #060608;
  --glass: rgba(18,18,26,0.72);
  --line: rgba(255,255,255,0.08);
  --line2: rgba(255,255,255,0.14);
  --ink: #f4f4f8;
  --muted: #8a8a9e;
  --pink: #e11d74;
  --pink2: #ff3d8f;
  --green: #22c55e;
  --radius: 16px;
  --blur: blur(22px) saturate(140%);
  --font: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);
  background:
    radial-gradient(1200px 800px at 10% -10%, rgba(225,29,116,0.14), transparent 60%),
    radial-gradient(900px 600px at 100% 0%, rgba(80,80,255,0.08), transparent 55%),
    radial-gradient(800px 800px at 50% 110%, rgba(225,29,116,0.06), transparent 60%),
    var(--bg);
  color:var(--ink);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:flex;flex-direction:column;
}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
.hdr{
  display:flex;align-items:center;gap:14px;
  padding:14px 22px;
  background:rgba(6,6,8,0.78);
  backdrop-filter:var(--blur);
  -webkit-backdrop-filter:var(--blur);
  border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:50;
  flex-wrap:wrap;
}
.logo{
  font-size:26px;font-weight:800;letter-spacing:-0.6px;
  background:linear-gradient(135deg,#fff 30%,var(--pink2) 70%,var(--pink));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-decoration:none;white-space:nowrap;
}
.search{flex:1;display:flex;min-width:220px;max-width:620px}
.search input{
  flex:1;padding:11px 16px;
  border:1px solid var(--line2);border-right:0;
  border-radius:10px 0 0 10px;
  font-size:14px;outline:none;
  background:rgba(255,255,255,0.04);
  color:var(--ink);
  transition:border-color .15s,background .15s;
}
.search input::placeholder{color:#5a5a6e}
.search input:focus{border-color:var(--pink);background:rgba(255,255,255,0.06)}
.search button{
  padding:11px 20px;
  background:linear-gradient(135deg,var(--pink),var(--pink2));
  color:#fff;border:none;border-radius:0 10px 10px 0;
  font-weight:700;font-size:13px;letter-spacing:.3px;
}
.hdr-nav{display:flex;gap:12px;align-items:center}
.cart-link{
  text-decoration:none;font-weight:600;font-size:14px;
  display:inline-flex;align-items:center;gap:7px;
  padding:9px 15px;border-radius:10px;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--line);
  transition:border-color .15s;
}
.cart-link:hover{border-color:var(--pink)}
.badge{
  background:var(--pink);color:#fff;
  border-radius:10px;padding:1px 7px;
  font-size:11px;font-weight:800;min-width:20px;text-align:center;
}
.cats{
  display:flex;gap:8px;padding:12px 22px;
  overflow-x:auto;white-space:nowrap;scrollbar-width:none;
  border-bottom:1px solid var(--line);
  background:rgba(8,8,12,0.6);
  backdrop-filter:blur(18px);
}
.cats::-webkit-scrollbar{display:none}
.cats a{
  text-decoration:none;color:#a8a8bc;
  font-size:13px;font-weight:500;
  padding:7px 15px;border-radius:20px;
  border:1px solid transparent;
  transition:all .15s;
}
.cats a:hover{color:#fff;border-color:var(--line2);background:rgba(255,255,255,0.04)}
.cats a.active{color:#fff;background:rgba(225,29,116,0.18);border-color:rgba(225,29,116,0.4)}
main{padding:28px 22px 70px;max-width:1340px;width:100%;margin:0 auto;flex:1}
.sec-title{font-size:22px;font-weight:750;letter-spacing:-0.4px;margin:0 0 6px}
.sec-sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.sync-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:12px;color:var(--muted)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
@media(max-width:540px){
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  main{padding:18px 12px 50px}
  .hdr{padding:12px 14px}
  .cats{padding:10px 14px}
}
.card{
  background:var(--glass);
  backdrop-filter:var(--blur);
  -webkit-backdrop-filter:var(--blur);
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
  text-decoration:none;color:inherit;
  display:flex;flex-direction:column;
  transition:transform .18s,box-shadow .18s,border-color .18s;
}
.card:hover{
  transform:translateY(-4px);
  border-color:var(--line2);
  box-shadow:0 18px 44px rgba(0,0,0,0.55),0 0 0 1px rgba(225,29,116,0.08);
}
.card-img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:linear-gradient(135deg,#14141c,#1c1c26)}
.card-body{padding:12px 13px 15px;flex:1;display:flex;flex-direction:column}
.card-title{
  font-size:13px;font-weight:600;line-height:1.35;
  margin-bottom:8px;color:#e8e8f0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;min-height:2.7em;
}
.price-row{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;margin-bottom:8px}
.price{font-size:16px;font-weight:800;letter-spacing:-0.2px}
.mrp{font-size:12px;color:#6a6a80;text-decoration:line-through}
.disc{font-size:11px;color:var(--green);font-weight:700}
.rating{
  display:inline-flex;align-items:center;gap:4px;
  background:rgba(34,197,94,0.14);color:#4ade80;
  padding:3px 8px;border-radius:6px;
  font-size:11px;font-weight:700;align-self:flex-start;
  border:1px solid rgba(34,197,94,0.22);
}
.rating.lg{font-size:12px;padding:4px 10px}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:40px}
@media(max-width:820px){.pd{grid-template-columns:1fr;gap:22px}}
.gallery-main{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:var(--radius);background:linear-gradient(135deg,#14141c,#1c1c26);border:1px solid var(--line)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:11px}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;cursor:pointer;border:1px solid var(--line);opacity:.65;transition:all .15s}
.thumbs img.active{border-color:var(--pink);opacity:1}
.pd-info h1{font-size:24px;font-weight:750;line-height:1.3;margin-bottom:12px;letter-spacing:-0.4px}
.pd-price{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:18px 0;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.pd-price .price{font-size:30px}
.pd-price .mrp{font-size:15px}
.pd-desc{color:#a8a8bc;font-size:14px;margin-bottom:18px;line-height:1.7}
.qty-row{display:flex;align-items:center;gap:12px;margin:18px 0}
.qty-btn{width:38px;height:38px;border:1px solid var(--line2);background:rgba(255,255,255,0.04);color:var(--ink);border-radius:10px;font-size:18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;transition:border-color .15s,background .15s}
.qty-btn:hover{border-color:var(--pink);background:rgba(225,29,116,0.1)}
.qty-val{font-weight:800;min-width:26px;text-align:center;font-size:15px}
.buy{display:block;width:100%;padding:15px;background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:750;letter-spacing:.2px;margin-top:12px;transition:opacity .15s,transform .05s;box-shadow:0 8px 24px rgba(225,29,116,0.28)}
.buy:hover{opacity:.92}
.buy:active{transform:scale(.985)}
.buy.alt{background:rgba(255,255,255,0.06);border:1px solid var(--line2);box-shadow:none}
.buy.alt:hover{background:rgba(255,255,255,0.1)}
.spec{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;line-height:2.1;color:#9a9ab0}
.spec strong{color:var(--ink);font-weight:600}
.reviews{margin-top:44px}
.review-summary{display:flex;gap:28px;padding:22px;background:var(--glass);backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:18px;align-items:center}
@media(max-width:600px){.review-summary{flex-direction:column;align-items:flex-start;gap:14px}}
.review-score{text-align:center}
.review-score .num{font-size:44px;font-weight:800;line-height:1;letter-spacing:-1px}
.review-score .stars{color:#f59e0b;font-size:17px;margin-top:5px;letter-spacing:2px}
.review-score .count{color:var(--muted);font-size:12px;margin-top:5px}
.review-bars{flex:1;width:100%}
.bar-row{display:flex;align-items:center;gap:9px;font-size:12px;margin-bottom:5px;color:var(--muted)}
.bar-track{flex:1;height:7px;background:rgba(255,255,255,0.07);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--green),#4ade80);border-radius:4px}
.review{padding:16px 0;border-bottom:1px solid var(--line)}
.review:last-child{border-bottom:none}
.review-head{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:13px}
.review-head strong{font-weight:700}
.review-head .date{color:var(--muted);margin-left:auto;font-size:11px}
.review-body{font-size:14px;color:#a8a8bc;line-height:1.65}
.field{margin-bottom:13px}
.field label{display:block;font-size:11px;font-weight:700;margin-bottom:6px;color:#8a8a9e;text-transform:uppercase;letter-spacing:.6px}
.field input,.field textarea,.field select{width:100%;padding:11px 13px;border:1px solid var(--line2);border-radius:10px;font-family:inherit;font-size:14px;background:rgba(255,255,255,0.04);color:var(--ink);transition:border-color .15s,background .15s}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--pink);background:rgba(255,255,255,0.06)}
.field textarea{resize:vertical;min-height:64px}
.field select option{background:#12121a}
.cart-item{display:flex;gap:15px;padding:15px;background:var(--glass);backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:11px;align-items:center}
.cart-item img{width:74px;height:92px;object-fit:cover;border-radius:9px;background:#14141c}
.cart-info{flex:1;min-width:0}
.cart-info a{text-decoration:none;font-weight:600;font-size:14px;display:block;margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cart-info .p{font-weight:700;font-size:15px;color:#d8d8e4}
.cart-actions{display:flex;flex-direction:column;gap:7px;align-items:flex-end}
.rm-btn{background:none;border:none;color:var(--muted);font-size:11px;padding:4px;text-decoration:underline}
.rm-btn:hover{color:#f87171}
.cart-total{padding:18px;background:var(--glass);backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:var(--radius);margin:18px 0;display:flex;justify-content:space-between;font-size:17px}
.cart-total strong{font-weight:800}
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty-icon{font-size:52px;margin-bottom:14px;opacity:.35}
.empty a{color:var(--pink2);font-weight:600;text-decoration:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.72);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;opacity:0;pointer-events:none;transition:opacity .22s}
.modal.open{opacity:1;pointer-events:auto}
.modal-box{background:rgba(18,18,26,0.92);backdrop-filter:var(--blur);border:1px solid var(--line2);border-radius:18px;padding:26px;max-width:470px;width:100%;max-height:90vh;overflow-y:auto;transform:scale(.95);transition:transform .22s;box-shadow:0 30px 80px rgba(0,0,0,0.7)}
.modal.open .modal-box{transform:scale(1)}
.modal-box h2{font-size:20px;margin-bottom:18px;letter-spacing:-0.3px}
.modal-header{position:relative;margin-bottom:6px}
.modal-close{position:absolute;top:14px;right:18px;background:none;border:none;font-size:26px;color:#7a7a90;line-height:1}
.modal-close:hover{color:#fff}
.summary{background:rgba(255,255,255,0.04);border:1px solid var(--line);padding:15px;border-radius:11px;margin-bottom:18px;font-size:13px;line-height:1.8}
.summary hr{border:none;border-top:1px solid var(--line);margin:11px 0}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(90px);background:rgba(18,18,26,0.95);backdrop-filter:blur(16px);border:1px solid var(--line2);color:#fff;padding:13px 22px;border-radius:12px;font-size:13px;font-weight:500;box-shadow:0 16px 44px rgba(0,0,0,0.6);z-index:300;transition:transform .3s cubic-bezier(.4,0,.2,1);pointer-events:none;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.ftr{text-align:center;padding:36px 22px;color:#6a6a80;font-size:12px;line-height:2;border-top:1px solid var(--line);background:rgba(6,6,8,0.6)}
.ftr a{color:var(--pink2);text-decoration:none;font-weight:600}
.skel{background:linear-gradient(90deg,rgba(255,255,255,0.04) 0%,rgba(255,255,255,0.09) 50%,rgba(255,255,255,0.04) 100%);background-size:200% 100%;animation:shimmer 1.3s infinite;border-radius:8px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.hidden{display:none!important}
</style>
</head>
<body>

<header class="hdr">
  <a href="#/" class="logo">Callote</a>
  <form class="search" id="searchForm">
    <input type="search" id="searchInput" placeholder="Search live catalog..." autocomplete="off">
    <button type="submit">Search</button>
  </form>
  <nav class="hdr-nav">
    <a href="#/cart" class="cart-link">Cart <span class="badge" id="cartBadge">0</span></a>
  </nav>
</header>

<nav class="cats" id="cats"></nav>
<main id="app"></main>

<footer class="ftr">
  <p>© <span id="year"></span> Callote — Premium store. Live catalog via DummyJSON.</p>
  <p>Order on WhatsApp: <a href="https://wa.me/918130826904">+91 81308 26904</a></p>
</footer>

<div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════
   CONFIG
   ═══════════════════════════════════════════════════════════ */
const CFG = {
  whatsapp: '918130826904',
  margin: 1.15,
  mrpMult: 1.6,
  api: 'https://dummyjson.com',
};

/* ═══════════════════════════════════════════════════════════
   UTIL
   ═══════════════════════════════════════════════════════════ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const fmt = n => '₹' + Number(n || 0).toLocaleString('en-IN');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

const state = {
  cart: JSON.parse(localStorage.getItem('callote_cart') || '[]'),
  catalog: [],
  source: 'live',
  page: 1,
  query: '',
  loading: false,
  done: false,
};

const saveCart = () => {
  localStorage.setItem('callote_cart', JSON.stringify(state.cart));
  $('#cartBadge').textContent = state.cart.reduce((s, i) => s + i.qty, 0);
};

function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2400);
}

function openModal(html) {
  $('#modalBox').innerHTML = html;
  $('#modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  $('#modal').classList.remove('open');
  document.body.style.overflow = '';
}

/* ═══════════════════════════════════════════════════════════
   NORMALIZE DUMMYJSON PRODUCT
   ═══════════════════════════════════════════════════════════ */
function normalizeItem(p) {
  if (!p) return null;
  const rawPrice = Number(p.price || 0);
  if (!rawPrice) return null;

  const sell = Math.round(rawPrice * CFG.margin);
  const mrp = Math.round(sell * CFG.mrpMult);
  const images = [].concat(p.images || []).filter(Boolean);

  return {
    id: String(p.id),
    title: p.title || 'Product',
    description: p.description || '',
    price: sell,
    mrp,
    discount: Math.round((1 - 1 / CFG.mrpMult) * 100),
    rating: Number(p.rating || 0),
    ratingCount: (p.reviews && p.reviews.length) || 0,
    image: p.thumbnail || images[0] || '',
    images: images.slice(0, 5),
    brand: p.brand || 'Callote',
    category: p.category || '',
    stock: p.stock || 100,
    reviews: p.reviews || [],
  };
}

/* ═══════════════════════════════════════════════════════════
   API HELPERS
   ═══════════════════════════════════════════════════════════ */
async function api(path) {
  const res = await fetch(CFG.api + path);
  if (!res.ok) throw new Error('Network error');
  return res.json();
}

async function fetchAllProducts(limit = 0) {
  const data = await api(`/products?limit=${limit}`);
  return (data.products || []).map(normalizeItem).filter(Boolean);
}

async function fetchSearch(query) {
  const data = await api(`/products/search?q=${encodeURIComponent(query)}`);
  return (data.products || []).map(normalizeItem).filter(Boolean);
}

async function fetchCategory(slug) {
  const data = await api(`/products/category/${encodeURIComponent(slug)}`);
  return (data.products || []).map(normalizeItem).filter(Boolean);
}

async function fetchCategories() {
  return api('/products/categories');
}

async function fetchProduct(id) {
  const data = await api(`/products/${encodeURIComponent(id)}`);
  return normalizeItem(data);
}

/* ═══════════════════════════════════════════════════════════
   CARDS
   ═══════════════════════════════════════════════════════════ */
function card(p) {
  return `
    <a class="card" href="#/p/${p.id}">
      <img class="card-img" src="${p.image || (p.images && p.images[0]) || ''}"
           alt="${esc(p.title)}" loading="lazy"
           onerror="this.src='https://via.placeholder.com/400x500?text=Callote'">
      <div class="card-body">
        <div class="card-title">${esc(p.title)}</div>
        <div class="price-row">
          <span class="price">${fmt(p.price)}</span>
          <span class="mrp">${fmt(p.mrp)}</span>
          <span class="disc">${p.discount}% off</span>
        </div>
        ${p.rating ? `<span class="rating">★ ${p.rating} (${p.ratingCount || 0})</span>` : ''}
      </div>
    </a>`;
}

function skeletonGrid(n = 10) {
  return `<div class="grid">${Array.from({ length: n }, () => `
    <div class="card">
      <div class="skel" style="aspect-ratio:4/5"></div>
      <div style="padding:12px 13px 15px">
        <div class="skel" style="height:14px;margin-bottom:7px"></div>
        <div class="skel" style="height:12px;width:60%"></div>
      </div>
    </div>`).join('')}</div>`;
}

function syncBadge() {
  return `<div class="sync-row"><span class="sync-dot"></span> Live catalog</div>`;
}

/* ═══════════════════════════════════════════════════════════
   HOME
   ═══════════════════════════════════════════════════════════ */
async function home() {
  $('#app').innerHTML = `
    <h2 class="sec-title">Trending now</h2>
    <p class="sec-sub">Top-rated picks across all categories</p>
    ${syncBadge()}
    ${skeletonGrid(12)}`;
  window.scrollTo(0, 0);

  try {
    const items = await fetchAllProducts(0);
    state.catalog = items;
    state.source = 'live';
    $('#app').innerHTML = `
      <h2 class="sec-title">Trending now</h2>
      <p class="sec-sub">${items.length} products across all categories</p>
      ${syncBadge()}
      <div class="grid">${items.slice(0, 24).map(card).join('')}</div>`;
  } catch {
    $('#app').innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><p>Couldn't load catalog. Check your connection.</p><p><a href="#/">Retry</a></p></div>`;
  }
}

/* ═══════════════════════════════════════════════════════════
   SEARCH
   ═══════════════════════════════════════════════════════════ */
async function search(q) {
  state.query = q;
  state.page = 1;
  state.done = false;
  state.loading = false;
  state.catalog = [];

  $('#app').innerHTML = `
    <h2 class="sec-title">Results for "${esc(q)}"</h2>
    ${syncBadge()}
    ${skeletonGrid(8)}`;
  window.scrollTo(0, 0);

  await loadMore();
}

async function loadMore() {
  if (state.loading || state.done) return;
  state.loading = true;

  try {
    const items = await fetchSearch(state.query);
    state.catalog.push(...items);
    state.done = true; // DummyJSON search returns all matches

    const gridId = 'searchGrid';
    let grid = document.getElementById(gridId);
    if (!grid) {
      $('#app').innerHTML = `
        <h2 class="sec-title">Results for "${esc(state.query)}"</h2>
        <p class="sec-sub">${state.catalog.length} products</p>
        ${syncBadge()}
        <div class="grid" id="${gridId}"></div>`;
      grid = document.getElementById(gridId);
    } else {
      const sub = $('#app .sec-sub');
      if (sub) sub.textContent = `${state.catalog.length} products`;
    }

    grid.innerHTML = state.catalog.map(card).join('');

    if (!state.catalog.length) {
      $('#app').innerHTML = `
        <h2 class="sec-title">Results for "${esc(state.query)}"</h2>
        <div class="empty"><div class="empty-icon">🔍</div><p>No products found for "${esc(state.query)}".</p><p><a href="#/">Browse all products</a></p></div>`;
    }
  } catch {
    toast('Search failed');
  } finally {
    state.loading = false;
  }
}

/* ═══════════════════════════════════════════════════════════
   CATEGORY
   ═══════════════════════════════════════════════════════════ */
async function category(slug) {
  $('#app').innerHTML = `<h2 class="sec-title">${esc(slug.replace(/-/g,' '))}</h2>${skeletonGrid(8)}`;
  window.scrollTo(0, 0);

  try {
    const items = await fetchCategory(slug);
    state.catalog = items;
    $('#app').innerHTML = `
      <h2 class="sec-title">${esc(slug.replace(/-/g,' '))}</h2>
      <p class="sec-sub">${items.length} products</p>
      <div class="grid">${items.map(card).join('')}</div>`;
  } catch {
    $('#app').innerHTML = `<div class="empty"><div class="empty-icon">📦</div><p>Couldn't load category.</p><p><a href="#/">Back</a></p></div>`;
  }
}

/* ═══════════════════════════════════════════════════════════
   PRODUCT DETAIL
   ═══════════════════════════════════════════════════════════ */
async function product(id) {
  $('#app').innerHTML = `
    <div class="pd">
      <div class="skel" style="aspect-ratio:4/5;border-radius:16px"></div>
      <div>
        <div class="skel" style="height:26px;margin-bottom:14px"></div>
        <div class="skel" style="height:16px;width:60%;margin-bottom:14px"></div>
        <div class="skel" style="height:44px;width:40%"></div>
      </div>
    </div>`;
  window.scrollTo(0, 0);

  let p;
  try {
    p = await fetchProduct(id);
  } catch {
    p = state.catalog.find(x => x.id === id);
  }

  if (!p) {
    $('#app').innerHTML = `<div class="empty"><div class="empty-icon">📦</div><p>Product not found.</p><p><a href="#/">Back to store</a></p></div>`;
    return;
  }

  const images = p.images?.length ? p.images : [p.image].filter(Boolean);
  const r = p.rating || 0;
  const rc = p.ratingCount || 0;
  const stars = '★'.repeat(Math.round(r)) + '☆'.repeat(5 - Math.round(r));
  const reviews = p.reviews || [];

  $('#app').innerHTML = `
    <div class="pd">
      <div>
        <img class="gallery-main" id="mainImg" src="${images[0] || ''}" alt="${esc(p.title)}">
        ${images.length > 1 ? `<div class="thumbs">${images.map((img, i) => `
          <img src="${img}" data-idx="${i}" class="${i === 0 ? 'active' : ''}" alt="">`).join('')}
        </div>` : ''}
      </div>
      <div class="pd-info">
        <h1>${esc(p.title)}</h1>
        ${r ? `<span class="rating lg">★ ${r} · ${rc} reviews</span>` : ''}
        <div class="pd-price">
          <span class="price">${fmt(p.price)}</span>
          <span class="mrp">${fmt(p.mrp)}</span>
          <span class="disc">${p.discount}% off</span>
        </div>
        <p class="pd-desc">${esc(p.description || 'Premium product curated for Callote.')}</p>
        <div class="qty-row">
          <span style="font-weight:600;font-size:13px;color:#a8a8bc">Qty:</span>
          <button class="qty-btn" id="minus">−</button>
          <span class="qty-val" id="qty">1</span>
          <button class="qty-btn" id="plus">+</button>
        </div>
        <button class="buy" id="buy">Buy Now — Order on WhatsApp</button>
        <button class="buy alt" id="add">Add to Cart</button>
        <div class="spec">
          <div><strong>Brand:</strong> ${esc(p.brand)}</div>
          <div><strong>Category:</strong> ${esc(p.category.replace(/-/g,' '))}</div>
          <div><strong>Stock:</strong> ${p.stock}</div>
          <div><strong>Delivery:</strong> 3–7 business days</div>
        </div>
      </div>
    </div>

    <div class="reviews">
      <h2 class="sec-title">Ratings & Reviews</h2>
      <div class="review-summary">
        <div class="review-score">
          <div class="num">${r || '—'}</div>
          <div class="stars">${r ? stars : ''}</div>
          <div class="count">${rc} reviews</div>
        </div>
        <div class="review-bars">
          ${[5,4,3,2,1].map(s => `
            <div class="bar-row">
              <span style="width:14px">${s}</span>
              <div class="bar-track"><div class="bar-fill" style="width:${r ? Math.round((s === Math.round(r) ? 62 : 12)) : 0}%"></div></div>
            </div>`).join('')}
        </div>
      </div>
      ${reviews.length
        ? reviews.map(rev => `<div class="review"><div class="review-head"><strong>${esc(rev.reviewerName || 'Customer')}</strong><span class="rating">★ ${rev.rating}</span><span class="date">${esc(rev.date || '')}</span></div><div class="review-body">${esc(rev.comment || '')}</div></div>`).join('')
        : `<p style="color:#6a6a80;font-size:13px;padding:14px 0">No detailed reviews yet.</p>`}
    </div>`;

  let qty = 1;
  $('#minus').onclick = () => { if (qty > 1) { qty--; $('#qty').textContent = qty; } };
  $('#plus').onclick = () => { qty++; $('#qty').textContent = qty; };

  $$('.thumbs img').forEach(img => img.onclick = () => {
    $('#mainImg').src = images[+img.dataset.idx];
    $$('.thumbs img').forEach(i => i.classList.toggle('active', i === img));
  });

  $('#buy').onclick = () => checkout([{ ...p, qty }]);
  $('#add').onclick = () => {
    const ex = state.cart.find(i => i.id === p.id);
    if (ex) ex.qty += qty;
    else state.cart.push({ id: p.id, title: p.title, price: p.price, image: p.image, qty });
    saveCart();
    toast(`Added ${qty} to cart`);
  };
}

/* ═══════════════════════════════════════════════════════════
   CART
   ═══════════════════════════════════════════════════════════ */
function cart() {
  if (!state.cart.length) {
    $('#app').innerHTML = `<div class="empty"><div class="empty-icon">🛒</div><h2 class="sec-title" style="margin-bottom:10px">Your cart is empty</h2><p>Add products to start your order.</p><p style="margin-top:18px"><a href="#/">Continue shopping</a></p></div>`;
    return;
  }

  const total = state.cart.reduce((s, i) => s + i.price * i.qty, 0);

  $('#app').innerHTML = `
    <h2 class="sec-title">Your Cart (${state.cart.length})</h2>
    ${state.cart.map(i => `
      <div class="cart-item">
        <img src="${i.image || ''}" alt="" onerror="this.style.background='#14141c'">
        <div class="cart-info">
          <a href="#/p/${i.id}">${esc(i.title)}</a>
          <div class="p">${fmt(i.price)} × ${i.qty} = <strong>${fmt(i.price * i.qty)}</strong></div>
        </div>
        <div class="cart-actions">
          <div class="qty-row" style="margin:0">
            <button class="qty-btn" data-dec="${i.id}">−</button>
            <span class="qty-val">${i.qty}</span>
            <button class="qty-btn" data-inc="${i.id}">+</button>
          </div>
          <button class="rm-btn" data-rm="${i.id}">Remove</button>
        </div>
      </div>`).join('')}
    <div class="cart-total"><span>Total</span><strong>${fmt(total)}</strong></div>
    <button class="buy" id="checkout">Checkout on WhatsApp</button>
    <button class="buy alt" id="continue">Continue Shopping</button>`;

  $$('[data-inc]').forEach(b => b.onclick = () => {
    const i = state.cart.find(x => x.id === b.dataset.inc);
    if (i) i.qty++;
    saveCart(); cart();
  });
  $$('[data-dec]').forEach(b => b.onclick = () => {
    const i = state.cart.find(x => x.id === b.dataset.dec);
    if (i) i.qty = Math.max(1, i.qty - 1);
    saveCart(); cart();
  });
  $$('[data-rm]').forEach(b => b.onclick = () => {
    state.cart = state.cart.filter(x => x.id !== b.dataset.rm);
    saveCart(); cart();
  });
  $('#checkout').onclick = () => checkout(state.cart.map(i => ({ ...i })));
  $('#continue').onclick = () => location.hash = '#/';
}

/* ═══════════════════════════════════════════════════════════
   CHECKOUT → WHATSAPP
   ═══════════════════════════════════════════════════════════ */
function checkout(items) {
  const total = items.reduce((s, i) => s + i.price * i.qty, 0);

  openModal(`
    <div class="modal-header">
      <h2>Confirm your order</h2>
      <button class="modal-close" id="close">×</button>
    </div>
    <div class="summary">
      ${items.map(i => `
        <div style="display:flex;justify-content:space-between;gap:12px;margin-bottom:5px">
          <span>${esc(i.title)} × ${i.qty}</span>
          <strong>${fmt(i.price * i.qty)}</strong>
        </div>`).join('')}
      <hr>
      <div style="display:flex;justify-content:space-between;font-size:16px">
        <strong>Total</strong><strong>${fmt(total)}</strong>
      </div>
    </div>
    <form id="orderForm">
      <div class="field"><label>Full name</label><input name="name" required maxlength="60" placeholder="Your name"></div>
      <div class="field"><label>Phone</label><input name="phone" type="tel" required pattern="[0-9+\\s-]{8,15}" placeholder="10-digit mobile"></div>
      <div class="field"><label>Address</label><textarea name="address" required maxlength="300" placeholder="House no, street, city, state"></textarea></div>
      <div class="field"><label>Pincode</label><input name="pincode" required pattern="[0-9]{4,8}" placeholder="e.g. 110001"></div>
      <button class="buy" type="submit" style="margin-top:8px">Send Order on WhatsApp</button>
      <p style="font-size:11px;color:#6a6a80;text-align:center;margin-top:12px">
        You'll be redirected to WhatsApp to confirm your order.
      </p>
    </form>`);

  $('#close').onclick = closeModal;

  $('#orderForm').onsubmit = e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    const lines = [
      '*New Order — Callote*', '',
      '*Items:*',
      ...items.map(i => `• ${i.title}\n   ×${i.qty} — ${fmt(i.price * i.qty)}`),
      '', `*Total: ${fmt(total)}*`, '',
      `Name: ${f.name}`,
      `Phone: ${f.phone}`,
      `Address: ${f.address}`,
      `Pincode: ${f.pincode}`,
    ];
    window.open(`https://wa.me/${CFG.whatsapp}?text=${encodeURIComponent(lines.join('\n'))}`, '_blank');
    closeModal();
    if (state.cart.length) { state.cart = []; saveCart(); }
    toast('Order sent on WhatsApp');
  };
}

/* ═══════════════════════════════════════════════════════════
   ROUTER
   ═══════════════════════════════════════════════════════════ */
function router() {
  const h = location.hash.slice(2) || '';
  const [part, ...rest] = h.split('/');
  const arg = rest.join('/');

  if (!part) return home();
  if (part === 'search' && arg) return search(decodeURIComponent(arg));
  if (part === 'c' && arg) return category(decodeURIComponent(arg));
  if (part === 'p' && arg) return product(decodeURIComponent(arg));
  if (part === 'cart') return cart();
  home();
}

/* ═══════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════ */
(async () => {
  $('#year').textContent = new Date().getFullYear();

  try {
    const cats = await fetchCategories();
    $('#cats').innerHTML = cats.map(slug =>
      `<a href="#/c/${encodeURIComponent(slug)}">${esc(slug.replace(/-/g,' '))}</a>`
    ).join('');
  } catch {
    $('#cats').innerHTML = '';
  }

  $('#searchForm').onsubmit = e => {
    e.preventDefault();
    const q = $('#searchInput').value.trim();
    if (q) location.hash = `#/search/${encodeURIComponent(q)}`;
  };

  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  window.addEventListener('hashchange', router);
  saveCart();
  router();
})();
</script>
</body>
