<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOULSTAKER | Premium Catalog</title>
    
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600&display=swap');

        :root {
            --bg-base: #050505;
            --bg-elevated: #090909;
            --bg-charcoal: #111111;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --accent-gold: #d4af37; /* Refined luxury gold */
            
            /* Glassmorphism Master Variables */
            --glass-bg: rgba(255, 255, 255, 0.035);
            --glass-border: rgba(255, 255, 255, 0.09);
            --glass-blur: blur(24px);
            --glass-shadow: 0 12px 40px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.045);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            /* Cinematic ambient lighting */
            background-image: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.03) 0%, transparent 60%),
                              radial-gradient(circle at 50% 100%, rgba(255, 255, 255, 0.02) 0%, transparent 50%);
            background-attachment: fixed;
        }

        /* Typography */
        .logo-font { font-family: 'Cinzel', serif; letter-spacing: 0.1em; text-transform: uppercase; }

        /* Navigation */
        nav {
            position: fixed; top: 0; left: 0; width: 100%; padding: 20px 40px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 100; background: rgba(5, 5, 5, 0.6); backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--glass-border);
        }

        .nav-logo { font-size: 1.5rem; color: var(--text-primary); font-weight: 700; letter-spacing: 2px; }
        .nav-logo span { color: var(--accent-gold); text-shadow: 0 0 10px rgba(212, 175, 55, 0.3); }
        
        .nav-links { display: flex; gap: 30px; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: color 0.2s; }
        .nav-links a:hover { color: var(--text-primary); }

        /* Hero Section */
        .hero {
            min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 0 20px; position: relative;
        }

        .hero-title { font-size: 5rem; font-weight: 700; line-height: 1.1; margin-bottom: 24px; letter-spacing: 0.05em; }
        .hero-title span { color: var(--accent-gold); }
        
        .hero-desc { font-size: 1.1rem; color: var(--text-secondary); max-width: 600px; line-height: 1.6; margin-bottom: 40px; font-weight: 300; }

        .btn-primary {
            background: var(--text-primary); color: var(--bg-base);
            padding: 16px 40px; border-radius: 8px; font-weight: 600; font-size: 1rem;
            text-decoration: none; border: none; cursor: pointer; transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 255, 255, 0.15); }

        /* Catalog Section */
        .catalog { padding: 100px 10%; display: flex; flex-direction: column; align-items: center; }
        .section-title { font-size: 2rem; margin-bottom: 40px; text-align: center; color: var(--text-primary); }
        .section-title::after { content: ''; display: block; width: 60px; height: 1px; background: var(--accent-gold); margin: 15px auto 0; opacity: 0.5; }

        /* Glass Card */
        .chapter-card {
            width: 100%; max-width: 800px; 
            background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border); border-radius: 20px; padding: 40px;
            box-shadow: var(--glass-shadow);
            display: flex; justify-content: space-between; align-items: center; cursor: pointer;
            transition: all 0.3s ease; position: relative; overflow: hidden;
        }

        /* Glass Reflection Effect */
        .chapter-card::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.03), transparent);
            transform: skewX(-25deg); transition: left 0.7s ease;
        }
        .chapter-card:hover::before { left: 150%; }
        
        .chapter-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
        }

        .chapter-info { display: flex; flex-direction: column; gap: 8px; }
        .chapter-num { font-size: 0.8rem; color: var(--accent-gold); letter-spacing: 2px; text-transform: uppercase; font-weight: 600; }
        .chapter-name { font-size: 1.8rem; font-weight: 500; color: var(--text-primary); }

        .btn-read {
            background: transparent; border: 1px solid var(--glass-border); color: var(--text-primary);
            padding: 12px 30px; border-radius: 30px; font-weight: 500; transition: all 0.2s; cursor: pointer;
        }
        .chapter-card:hover .btn-read { background: var(--text-primary); color: var(--bg-base); }

        /* --------------------------------
           PREMIUM VIEWER
        ----------------------------------- */
        #viewer {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #020202; z-index: 2000; flex-direction: column;
        }

        .viewer-toolbar {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            width: 95%; max-width: 1000px; display: flex; justify-content: space-between; align-items: center;
            padding: 12px 24px; background: rgba(15, 15, 15, 0.7); backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border); border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 10; transition: opacity 0.3s;
        }

        .viewer-title { font-size: 0.9rem; font-weight: 500; letter-spacing: 1px; }
        .toolbar-controls { display: flex; align-items: center; gap: 15px; }
        
        .btn-icon {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary); width: 36px; height: 36px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s;
        }
        .btn-icon:hover { background: rgba(255, 255, 255, 0.15); }
        
        .btn-text {
            background: transparent; border: none; color: var(--text-secondary); cursor: pointer;
            font-size: 0.9rem; transition: 0.2s; padding: 5px 10px;
        }
        .btn-text:hover { color: var(--text-primary); }
        
        .btn-close { color: #ff6b6b; }
        .btn-close:hover { background: rgba(255, 50, 50, 0.2); border-color: rgba(255, 50, 50, 0.3); }

        .page-indicator { font-size: 0.9rem; font-weight: 500; color: var(--text-secondary); min-width: 60px; text-align: center; }

        /* Main View Area */
        .viewer-stage {
            flex: 1; position: relative; display: flex; justify-content: center; align-items: center;
            padding: 80px 20px; overflow: hidden;
        }

        #canvas-element {
            max-width: 100%; max-height: 100%; object-fit: contain;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9); border-radius: 4px;
            transition: opacity 0.2s ease; opacity: 0;
        }

        /* Click Zones for Mangadex-style turning */
        .click-zone { position: absolute; top: 0; bottom: 0; width: 25%; cursor: pointer; z-index: 5; }
        .zone-left { left: 0; }
        .zone-right { right: 0; }

        /* Side Arrows */
        .side-arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(15, 15, 15, 0.5); backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border); color: var(--text-secondary);
            width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 1.5rem; cursor: pointer; z-index: 10; transition: 0.2s;
        }
        .side-arrow:hover { background: rgba(255, 255, 255, 0.1); color: var(--text-primary); }
        #arrow-prev { left: 30px; }
        #arrow-next { right: 30px; }

        /* Settings Panel */
        .settings-menu {
            position: absolute; top: 80px; right: 5%; width: 280px;
            background: rgba(10, 10, 10, 0.9); backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border); border-radius: 16px; padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8); z-index: 20;
            display: none; flex-direction: column; gap: 20px;
        }
        .settings-menu.active { display: flex; }
        
        .setting-group { display: flex; flex-direction: column; gap: 10px; }
        .setting-label { font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; }
        
        .options-row { display: flex; gap: 8px; }
        .opt-btn {
            flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-primary); padding: 10px; border-radius: 8px; cursor: pointer;
            font-size: 0.85rem; transition: 0.2s;
        }
        .opt-btn.active, .opt-btn:hover { background: var(--text-primary); color: var(--bg-base); font-weight: 600; }

        /* Spinner */
        .spinner {
            position: absolute; width: 40px; height: 40px;
            border: 2px solid rgba(255, 255, 255, 0.1); border-top-color: var(--text-primary);
            border-radius: 50%; animation: spin 1s linear infinite; z-index: 5;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .hero-title { font-size: 3rem; }
            .chapter-card { flex-direction: column; text-align: center; gap: 20px; padding: 30px; }
            .nav-links { display: none; }
            .viewer-toolbar { width: 100%; top: 0; border-radius: 0; border-left: none; border-right: none; border-top: none; }
            .viewer-title { display: none; }
            .side-arrow { display: none; } /* Rely on click zones on mobile */
            .settings-menu { right: 50%; transform: translateX(50%); width: 90%; }
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav>
        <div class="nav-logo logo-font">S<span>O</span>ULSTAKER</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#catalog">Catalog</a>
        </div>
    </nav>

    <!-- Hero -->
    <section class="hero">
        <h1 class="hero-title logo-font">S<span>O</span>ULSTAKER</h1>
        <p class="hero-desc">In a world shattered by cosmic forces, one soul must traverse the ruins to uncover the truth. A dark fantasy epic by Aarav Jha.</p>
        <a href="#catalog" class="btn-primary">Explore Chapters</a>
    </section>

    <!-- Catalog -->
    <section class="catalog" id="catalog">
        <h2 class="section-title logo-font">Chapters</h2>
        
        <div class="chapter-card" onclick="openViewer()">
            <div class="chapter-info">
                <div class="chapter-num">Chapter 01</div>
                <div class="chapter-name">The First Glimpse</div>
            </div>
            <button class="btn-read">Read Now</button>
        </div>
    </section>

    <!-- Premium Viewer Modal -->
    <div id="viewer">
        
        <!-- Floating Toolbar -->
        <div class="viewer-toolbar">
            <div class="viewer-title logo-font">Chapter 1: The First Glimpse</div>
            
            <div class="toolbar-controls">
                <span class="page-indicator" id="page-ui">1 / 1</span>
                <button class="btn-icon" id="btn-settings" title="Settings">⚙</button>
                <button class="btn-icon btn-close" onclick="closeViewer()" title="Close (Esc)">✕</button>
            </div>
        </div>

        <!-- Settings Menu -->
        <div class="settings-menu" id="settings-menu">
            <div class="setting-group">
                <div class="setting-label">Reading Direction</div>
                <div class="options-row">
                    <button class="opt-btn dir-btn active" data-dir="ltr" onclick="setDirection('ltr')">Left to Right</button>
                    <button class="opt-btn dir-btn" data-dir="rtl" onclick="setDirection('rtl')">Right to Left</button>
                </div>
            </div>
            <div class="setting-group">
                <div class="setting-label">Image Quality</div>
                <div class="options-row">
                    <button class="opt-btn zoom-btn" data-scale="1.0" onclick="setQuality(1.0)">Standard</button>
                    <button class="opt-btn zoom-btn active" data-scale="1.5" onclick="setQuality(1.5)">High</button>
                    <button class="opt-btn zoom-btn" data-scale="2.0" onclick="setQuality(2.0)">Ultra</button>
                </div>
            </div>
        </div>

        <!-- Main Stage -->
        <div class="viewer-stage">
            <div class="spinner" id="spinner"></div>
            
            <!-- Click Zones for page turning -->
            <div class="click-zone zone-left" id="zone-prev" onclick="handleZoneClick('prev')"></div>
            <div class="click-zone zone-right" id="zone-next" onclick="handleZoneClick('next')"></div>

            <!-- Navigation Arrows -->
            <button class="side-arrow" id="arrow-prev" onclick="handleZoneClick('prev')">❮</button>
            <button class="side-arrow" id="arrow-next" onclick="handleZoneClick('next')">❯</button>

            <canvas id="canvas-element"></canvas>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // State
        let pdfDoc = null;
        let currentPage = 1;
        let totalPages = 0;
        let currentScale = 1.5;
        let direction = 'ltr'; // 'ltr' or 'rtl'
        let isRendering = false;

        // DOM Elements
        const viewer = document.getElementById('viewer');
        const canvas = document.getElementById('canvas-element');
        const ctx = canvas.getContext('2d');
        const spinner = document.getElementById('spinner');
        const pageUI = document.getElementById('page-ui');
        const settingsMenu = document.getElementById('settings-menu');
        const arrowPrev = document.getElementById('arrow-prev');
        const arrowNext = document.getElementById('arrow-next');

        // Setup PDF File Path (Adjust if needed)
        const PDF_PATH = './chapter1.pdf'; 

        // Toggle Settings
        document.getElementById('btn-settings').addEventListener('click', (e) => {
            e.stopPropagation();
            settingsMenu.classList.toggle('active');
        });

        // Close settings if clicking outside
        document.addEventListener('click', (e) => {
            if (!settingsMenu.contains(e.target) && e.target.id !== 'btn-settings') {
                settingsMenu.classList.remove('active');
            }
        });

        // Open Viewer
        async function openViewer() {
            viewer.style.display = 'flex';
            document.body.style.overflow = 'hidden';
            settingsMenu.classList.remove('active');
            
            if (!pdfDoc) {
                spinner.style.display = 'block';
                try {
                    // Load PDF
                    pdfDoc = await pdfjsLib.getDocument(PDF_PATH).promise;
                    totalPages = pdfDoc.numPages;
                    updateUI();
                    renderPage(currentPage);
                } catch (err) {
                    console.error("PDF Load Error:", err);
                    alert("Could not load the PDF. Make sure 'chapter1.pdf' is in the same folder and hosted correctly.");
                    closeViewer();
                }
            } else {
                // Re-render if already loaded
                renderPage(currentPage);
            }
        }

        // Close Viewer
        function closeViewer() {
            viewer.style.display = 'none';
            document.body.style.overflow = 'auto';
            settingsMenu.classList.remove('active');
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Free memory
        }

        // Change Direction
        function setDirection(dir) {
            direction = dir;
            document.querySelectorAll('.dir-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.dir === dir);
            });
            updateUI();
            renderPage(currentPage); // Re-render to ensure correct scaling/layout
        }

        // Change Quality
        function setQuality(scale) {
            currentScale = scale;
            document.querySelectorAll('.zoom-btn').forEach(btn => {
                btn.classList.toggle('active', parseFloat(btn.dataset.scale) === scale);
            });
            renderPage(currentPage);
        }

        // Unified Page Change Logic (Fixes LTR/RTL Glitch)
        function changePage(intent) {
            if (isRendering || !pdfDoc) return;

            // If intent is 'next', we add 1 for LTR, subtract 1 for RTL
            let step = (intent === 'next') ? 1 : -1;
            
            // Reverse step if reading RTL (Manga style)
            if (direction === 'rtl') {
                step *= -1;
            }

            let newPage = currentPage + step;

            // Boundary Check
            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                updateUI();
                renderPage(currentPage);
            }
        }

        // Handle Click Zones (Arrows & Screen Clicks)
        function handleZoneClick(clickedZone) {
            // Visually Left = prev, Right = next. 
            // But in RTL, Left physically means "Next Page". 
            // So we pass the *logical* intent to changePage.
            
            if (clickedZone === 'next') {
                changePage('next');
            } else {
                changePage('prev');
            }
        }

        // Update UI Elements (Arrows, Page Numbers)
        function updateUI() {
            pageUI.textContent = `${currentPage} / ${totalPages}`;

            // Update Arrow Icons based on Direction
            if (direction === 'ltr') {
                arrowPrev.innerHTML = '❮';
                arrowNext.innerHTML = '❯';
                arrowPrev.style.opacity = currentPage <= 1 ? '0.3' : '1';
                arrowNext.style.opacity = currentPage >= totalPages ? '0.3' : '1';
            } else {
                arrowPrev.innerHTML = '❯'; // Visually flipped for Manga
                arrowNext.innerHTML = '❮';
                arrowPrev.style.opacity = currentPage >= totalPages ? '0.3' : '1';
                arrowNext.style.opacity = currentPage <= 1 ? '0.3' : '1';
            }
        }

        // Render PDF Page to Canvas
        async function renderPage(num) {
            if (!pdfDoc) return;
            isRendering = true;
            spinner.style.display = 'block';
            canvas.style.opacity = '0.5';

            try {
                const page = await pdfDoc.getPage(num);
                const viewport = page.getViewport({ scale: currentScale });
                
                // Handle High DPI screens for crisp rendering
                const outputScale = window.devicePixelRatio || 1;
                
                canvas.width = Math.floor(viewport.width * outputScale);
                canvas.height = Math.floor(viewport.height * outputScale);
                canvas.style.width = Math.floor(viewport.width) + "px";
                canvas.style.height = Math.floor(viewport.height) + "px";

                const transform = outputScale !== 1 
                    ? [outputScale, 0, 0, outputScale, 0, 0] 
                    : null;

                const renderContext = {
                    canvasContext: ctx,
                    transform: transform,
                    viewport: viewport
                };

                await page.render(renderContext).promise;
                
                canvas.style.opacity = '1';
                spinner.style.display = 'none';
                isRendering = false;
            } catch (err) {
                console.error("Render Error:", err);
                isRendering = false;
            }
        }

        // Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
            if (viewer.style.display === 'flex') {
                if (e.key === 'Escape') closeViewer();
                if (e.key === 'ArrowRight') handleZoneClick('next');
                if (e.key === 'ArrowLeft') handleZoneClick('prev');
            }
        });
    </script>
</body>
</html>
